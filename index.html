<style>

th{color:var(--mut);font-weight:600;font-size:12px}
.sc{overflow-x:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 6px;max-width:100%}
input[type=text],input:not([type]){width:100%}
input[type=number]{width:64px}
input[type=checkbox]{width:18px;height:18px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.b.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.b.w{background:var(--warn)}

.note{color:var(--mut);font-size:13px}

.grid2{display:grid;grid-template-columns:1fr;gap:12px}

.dup{outline:2px solid var(--warn)}

var GUIA_MD=/*GUIA*/"# Guía de usuario · App Entrenador SUB14\n\nOrdenada por prioridad: empieza por arriba y baja solo cuando lo necesites. **La app no lleva explicaciones en sus pantallas: todo lo que necesitas saber está aquí.**\n\n- **Dirección:** https://aquiles1984.github.io/app-entrenador/ (instalada en el móvil como **S14A**, con el icono del escudo).\n- **Tus datos** se guardan solo en tu móvil. No hay servidor ni nube.\n\n---\n\n## Reglas básicas (léelas una vez)\n\n1. **Abajo** tienes la barra: **Inicio · Sesión · Partido · Pizarra · Más**. «Más» es una pantalla con el resto de pestañas. **La app siempre se abre en Inicio** (y vuelve a Inicio si llevas más de 30 minutos fuera). Si hay un partido a medias, Inicio te avisa con un botón para volver a él.\n2. **Atrás:** el botón **‹** de arriba a la izquierda, o el de atrás del móvil, te lleva a la pantalla anterior (también paso a paso en «En el campo»). Desde Inicio, el de atrás del móvil sale de la app.\n3. **Cuando cambias algo**, sale abajo la barra negra **«Cambios sin guardar» › Guardar / Cancelar**. Hasta que no pulsas Guardar, no se guarda. No te deja cambiar de pestaña sin guardar o cancelar.\n4. **Lo único que se guarda solo** es el partido una vez empezado (minutos, cambios), el avance de las tareas en el campo y la cuenta atrás.\n5. **Copia de seguridad** (Más › Jugadores › Plantilla › Copia de seguridad), en tres capas:\n   - **Fuera del móvil, una vez a la semana:** **«📤 Compartir copia»** y eliges **Samsung Notes** (con la sincronización de Samsung Cloud activada), **Google Drive** o WhatsApp. Es lo único que te salva si pierdes o rompes el móvil. Si llevas más de 7 días sin hacerla, **Inicio te avisa** con el mismo botón.\n   - **Automáticas dentro del móvil:** la app guarda sola una copia al guardar cambios (como mucho una cada 30 minutos), al guardar un partido, al terminar una sesión y antes de importar o borrar. Se ven las 10 últimas con su fecha y «Volver aquí». Sirven si borras algo sin querer.\n   - **Protección 🔒:** la app pide a Chrome que no borre sus datos aunque falte espacio. En la misma tarjeta ves si está activada.\n   - **Para recuperar** una copia de fuera: copias el texto de la nota o del mensaje, lo pegas en el cuadro «SUB14COPIA:…» y pulsas **Importar**.\n\n---\n\n## PRIORIDAD 1 · Lo que usarás cada día\n\n### Sesión (entreno)\nArriba eliges el **día** tocando una ficha de fecha. Debajo, tres pasos:\n\n| Paso | Cuándo | Qué haces |\n|---|---|---|\n| **1 · Antes** | La noche anterior | Arriba, en corto: día, campo, carga, 🎯 objetivo y 🧭 concepto de la quincena, con **✅ Validar sesión** y **✏️ Cambiar tareas**. El porqué de la carga, el material y la charla, en «Material y charla». Debajo, la lista de tareas (nombre y minutos) con el **🏁 Final** (balón parado y vuelta a la calma) y el **total en el campo** (la charla del vestuario no cuenta), **👥 Jugadores de hoy** con «Pasar lista», el **🆘 Plan B** y la «Ficha completa» para imprimir. |\n| **2 · En el campo** | Durante el entreno | Ver abajo. |\n| **3 · Después** | Al acabar | **Esfuerzo del grupo** (toca 1-10), **minutos reales**, **cada jugador** con un toque (1 flojo, 2 bien, 3 muy bien) y **✅ Terminar sesión**. |\n\n**🗣️ Hoy trabajamos y por qué** (en Antes, debajo del objetivo; se pliega tocando el título, igual que las Tareas, el pase de lista, el esfuerzo y cómo ha ido cada uno): la idea del día en palabras de los chavales, **¿por qué?**, la **palabra** del equipo, la **pregunta al final** y «Las 4 fases de hoy» (Calentamos, Aprendemos, Jugamos y Cerramos, con las tareas de cada una). Es lo que les cuentas en los 2 minutos del principio. En **En el campo** sale arriba la idea y la palabra; en **Después**, la pregunta del día. También va en la Ficha completa y en la Ficha para Pau.\n\n**✏️ Cambiar tareas** (desde Antes): quitas (✕), ordenas (▲▼), cambias los **minutos** de cada tarea o añades del **banco** (se abre con las **⭐ Recomendadas**: las del concepto de la quincena y la idea de la semana; arriba tienes los filtros y «✕ Cerrar»). Al añadir una, el banco se cierra y la tarea va al final. Pulsa **Guardar** al acabar. Si entras y no tocas nada, no cambia nada. «Volver a la original» deshace tus cambios.\n\n**Una sesión validada se puede cambiar igual:** Antes › **✏️ Cambiar tareas** (arriba, junto a «✅ Validada») › Guardar. Sigue validada.\n\n**Validar las sesiones que preparé yo.** Las sesiones ya preparadas salen con **⏳** en su fecha hasta que las validas. En **Antes** verás «Sin validar»: revísala, cambia lo que quieras con **✏️ Cambiar tareas** (añadir, cambiar o quitar ejercicios) y pulsa **✅ Validar sesión** › **Guardar**.\n- Si una fecha sale con **📝**, hay una **propuesta de cambio** mía (por ejemplo, adaptar a 1/4 de campo). En Antes ves qué cambia y cómo quedaría, con los diagramas, y eliges **✅ Aceptar** o **✕ Rechazar** › **Guardar**. Nada cambia sin tu visto bueno.\n- Si aceptas una propuesta y luego no te convence, ✏️ Editar › **«Volver a la original»**.\n\n**Vídeos de cada tarea:** en «Cómo se hace» (en el campo) y en la Ficha completa salen botones **▶️** con vídeos de YouTube de un ejercicio igual o parecido. Están comprobados que existen, pero no vistos uno a uno: míralos antes y adapta lo que no encaje.\n\n**En el campo, paso a paso:**\n1. **Pase de lista obligatorio:** pulsa **«✅ Todos presentes»** y cambia solo a los que faltan: **Sí** (viene), **Just.** (falta justificada) o **No** (falta). Luego **Guardar**. Hasta entonces, «Empezar la sesión» está bloqueado. Al marcar, la pantalla no se mueve ni se cierra la lista. El **semáforo** de molestias va plegado: **«🟢 Todos bien»** y cambias solo a quien le duela algo con 🟡 (molestia) o 🔴 (dolor); debajo sale «¿Dónde le duele?».\n2. **Empezar la sesión ▶** y vas **tarea a tarea**. En cada una, **un solo cronómetro**: **«▶ Empezar»** y el reloj sale en grande con **Pausa**, **+1 min** y **💧 Agua 1'** (para la tarea mientras beben; al acabar el minuto pita y **la tarea sigue sola** donde estaba; si quieres volver antes, «▶ Volver a la tarea»).\n3. Al acabar el tiempo, vibra, pita y sale **«⏰ ¡Tiempo!»**.\n4. **Un solo botón abajo a la derecha para avanzar**, que dice lo que hace: **«Saltar ▶»** si no la has empezado, **«Terminar tarea ▶»** si está en marcha y **«Siguiente ▶»** si ya acabó. La barra de arriba marca 🟩 hechas, 🟥 saltadas y 🟦 la actual.\n5. Arriba ves **cuánto llevas de sesión** y el botón **«↺ Reiniciar sesión»**: borra el avance de las tareas y el cronómetro (y, si quieres, el pase de lista de ese día) para empezar de cero, por ejemplo después de una prueba. Al final, **Ir a Después** y **✅ Terminar sesión**: queda guardada en **Más › Historial**.\n\n- Si la sesión es **hoy**, se abre directamente en «En el campo».\n- **Semáforo:** Bien, Molestia o Dolor (rodilla, talón…). Con molestia: menos saltos y esprints. Con dolor: sin impactos y avisar a la familia.\n\n### Partido\n| Momento | Qué haces |\n|---|---|\n| **Convocatoria (jueves o viernes)** | Rival › **convocatoria** › a cada **no convocado**, su **motivo** (lesión, enfermedad, sanción, decisión técnica, familia o estudios, no avisa, otro) › **✅ Convocatoria lista**. Queda guardada hasta el día del partido y ya no se cambia sin querer (para tocarla, **✏️ Cambiar convocatoria**). En **📲 Mensajes de la convocatoria**: escribe la **quedada** y copia el mensaje para el **grupo de familias** (solo convocados, sin motivos). Para cada no convocado hay un **mensaje privado** a su familia según el motivo. Antes de enviarlo, díselo tú al jugador en persona. Los motivos se guardan con el partido en el Historial. |\n| **Antes** | **Rival** en el desplegable (sale el del próximo partido; al lado, **📅 Calendario**), **convocatoria** (toca a cada jugador o «Convocar a todos»), **once inicial** (toca a los 11) y **▶ Empezar el partido**. Convocatoria y once inicial se pliegan tocando su título. Si en el once hay **2 porteros o ninguno**, sale un aviso (no bloquea). Con el once elegido: **Capitán** y **✅ Once listo** (queda guardado y bloqueado; para tocarlo, **✏️ Cambiar once**). **Si alguien se lesiona en el calentamiento:** si lo quitáis del acta, **✏️ Cambiar convocatoria**, lo desmarcas y pones el motivo; si sigue en el acta pero no juega, **🚑 Bajas** › motivo › **Dar de baja** (sale del once y no cuenta en «Sin minutos»). Las dos cosas quedan en el Historial. Todo esto se guarda solo: no sale la barra de Guardar. La **cronología** (desde 75 minutos antes) te dice qué hacer y cuándo en la previa. |\n| **Durante** | **Pausar / Reanudar**, **Fin de la 1ª parte** y **2ª parte**. En el descanso aparece **📊 Datos de posicionamiento** para ir apuntando. Abajo del reloj, **«✕ Cancelar este partido»** (pide confirmación) por si era una prueba. Bajo el reloj ves **💾 Guardado** con la hora: el partido se guarda solo cada pocos segundos, también en el descanso. |\n| **Cambios** | En la tarjeta **Cambios**: **«Abrir ventana»** › en la lista de debajo tocas al que **sale** (se marca en rojo) y luego al que **entra** › **«Cerrar ventana»**. Si prefieres desplegables, **«Cambiar con desplegables»** está justo encima de la lista. Los cambios de la ventana abierta salen en el recuadro verde, justo encima de la lista, con **Deshacer** en cada uno. En la lista, mientras la ventana está abierta, **quien sale se ve en rojo con «SALE» y quien entra en verde con «ENTRA»** (también en el recuadro). Si sale el portero y no queda ninguno en el campo, o quedan dos, te avisa. Cada jugador muestra **todas sus posiciones**. Máximo **9 cambios** por ventana y **3 ventanas** más el descanso. Con la ventana cerrada no se puede cambiar. **Quien sale en una ventana no puede volver a entrar en esa misma ventana** (sí en la siguiente), y quien acaba de entrar no puede salir en ella: tampoco aparecen en los desplegables. **Si cierras una ventana sin hacer cambios, no cuenta.** Las ventanas ya cerradas se ven en «Ventanas cerradas». Las ventanas se usan **cuando quieras**: 3 en todo el partido más el descanso, repartidas como quieras (por ejemplo, 1 en la primera parte y 2 en la segunda). **✏️ Corregir cambios** (con la ventana cerrada, durante o al final del partido): arriba puedes cambiar a alguien del **once inicial** (por ejemplo, el titular que se lesionó en el calentamiento); debajo cambias el minuto de una ventana, quién sale y quién entra, añades o quitas cambios y ventanas, y **+ Descanso** para apuntar los cambios del descanso si ya habías empezado la 2ª parte. **✅ Aplicar** recalcula los minutos de todos. Úsalo al acabar con la hoja de papel de Pau. El 🚑 de bajas también está aquí y al cerrar el partido. |\n| **Siempre visible** | Alerta **roja «Sin minutos»**: en Infantil S14 **todos los convocados deben jugar**. Se vuelve verde cuando todos han jugado. |\n| **Al acabar** | Arriba del todo sale **🏁 Cerrar el partido**: resultado, **✅ Guardar al historial** o **🗑 Descartar**. Debajo, **📊 datos de posicionamiento** (salidas limpias, robos en 5 s, veces que nos superan entre defensas y goles con un hueco sin cubrir), **evaluación** (defensa, salida de balón, finalización) y **mensaje** listo para copiar (familias y coordinador). **«Guardar al historial»** lo guarda todo en **Más › Historial**. |\n\n- **Golpe en la cabeza:** desplegable «🚑» en Partido: fuera del campo y no vuelve ese día, señales para llamar al 112 y botón de llamada.\n\n---\n\n## PRIORIDAD 2 · Lo que usarás cada semana\n\n### La semana tipo\n| Día | Campo | Qué toca |\n|---|---|---|\n| **Lunes** | Medio campo | Día táctico: posiciones, salida de balón, bloque defensivo y balón parado. Si jugasteis el **domingo**, sesión suave sin carga física; si fue el **sábado**, normal. |\n| **Martes** | 1/4 de campo | El día de **más carga física**, siempre con balón: duelos, juegos reducidos intensos, transiciones. Si hay partido a 2 días o menos, más corto. |\n| **Jueves** | 1/4 de campo | Corto y rápido antes del partido: velocidad, finalización y balón parado. Nada de cansar. |\n\n### Pau y tú en las tareas\nLas tareas no dicen dónde se pone cada adulto: lo decidís Pau y tú en cada sesión. Cuando una tarea necesita a los dos (2 zonas o 2 campos), pone «uno con cada uno de vosotros». En las descripciones, «tú» es quien lleva esa tarea o esa zona.\n\n### Crear los entrenos (Sesión › «+ Nueva»)\n1. Propone el siguiente día de entreno (saltándose los partidos) y el campo según el día.\n2. Arriba ves el **tipo de día** (carga y motivo) y el **concepto de la quincena** 🧭 del plan de 8 semanas.\n3. Elige la **idea de la semana** y escribe el **objetivo**.\n4. **«✨ Proponer sesión»** te monta las tareas según el día (lunes táctico, martes con carga, jueves corto) y **usa primero los ejercicios del concepto de la quincena**.\n5. **«📚 Sesión modelo»** carga una sesión entera ya pensada (de momento, **Posicionamiento y basculación en bloque**: rondo, coordenadas con conos, líneas con cintas, línea de 4 contra 5 pasadores y partido 8v8 en 2 pasillos). También funciona desde ✏️ Cambiar tareas.\n6. Ajusta: **«+ Añadir del banco»** (más de 50 tareas con diagrama; salen primero las del concepto de la quincena, con 🧭, y luego las de la idea de la semana, con ⭐), **«+ Tarea libre»**, ▲▼ para ordenar y ✕ para quitar. Controla el **total de minutos** (75).\n7. **Guardar.**\n- **Repetir una sesión:** ábrela › Antes › **«📄 Duplicar para otro día»**.\n- **Enviar a Pau en un toque:** ábrela › Antes › **«📲 Enviar a Pau»** (arriba, en la tarjeta de la sesión) › WhatsApp › Pau, y le llega en texto, con el título «S14A · Entreno del día…»: primero la semana (igual para todos los días de esa semana) y después el entreno (objetivo, hoy trabajamos y por qué, horario y material). Si el móvil no abre la lista para compartir, se copia y lo pegas tú en WhatsApp.\n- **Ficha para Pau con diagramas:** Antes › **«🖨️ Ficha para Pau»**. Sale una hoja con el título **«S14A · Entreno del día…»**, arriba **la semana** (el trabajo de la quincena, los entrenos y el partido) y después el entreno: objetivo, hoy trabajamos y por qué, material, **horario** desde las 20:00 y cada tarea con su diagrama. **«🖨️ PDF con diagramas»** › en el móvil elige **Guardar como PDF**: el archivo se llama «S14A AAAA-MM-DD entreno día», así se ordenan solos por fecha. Se lo pasas por WhatsApp; ahí también tienes **📲 Enviar a Pau**. No lleva nombres de jugadores. Si en la app instalada no se abre la impresión, abre la web en Chrome y hazlo desde ahí. **◀ Volver** te devuelve a Antes.\n- **Juegos de equipo:** 8 juegos para unir al grupo (reacción, velocidad, fuerza, resistencia y concentración), todos con diagrama, en **Grupo y normas › 🤝 Juegos de equipo** y en el banco (filtros Activación y Juego reducido) para meterlos en una sesión.\n\n### Más › Táctica 🧭\nTodo lo de táctica y técnica en un solo sitio. Arriba, **⭐ Lo esencial** en 5 líneas (siempre abierto); el resto, en desplegables. Cuatro bloques:\n- **Cómo enseñar:** lo esencial, **🏛️ Canteras de referencia** (qué hacen La Masia, Lezama, Villarreal, Zubieta, Ajax, la DFB, la FA… y qué copiamos: sesión tipo jugar–practicar–jugar, las 3 reglas de la temporada, cómo corregir, 5 preguntas para el campo y cómo medir en 8 semanas, con fuentes), mi opinión como coordinador, cuánto hablar y cuánto jugar, cómo hacer que ellos sean conscientes, lo que no puede faltar, cómo medir si mejoran y **📚 Para profundizar** (tipos de tareas, estrategias, pautas, edad).\n- **Posicionamiento: 6 conceptos** (ocupar el campo, perfilarse, ofrecerse, salida de balón —con **5 salidas de balón dibujadas**: cuándo usar cada una y su palabra—, cuándo saltar a presionar y qué hacer si un compañero pierde su posición). En cada uno ves arriba la **frase para decírselo** (💬) y qué es; debajo, desplegables: 🔑 claves, 🏃 **ejercicios paso a paso** con diagrama, ❓ preguntas, ⚠️ errores típicos, 📖 más detalle y ▶️ vídeos.\n- **Puestos y sistema:** **🧭 Nuestro 1-4-2-3-1** (los puestos con su número habitual, cómo nos colocamos en defensa y en ataque, la basculación y el repliegue, con 3 dibujos), **🧩 Los puestos explicados a los jugadores** (el 4-2-3-1 dibujado con el nombre de cada puesto; cada puesto con dónde juega, qué hace sin balón y con balón y una frase para recordarlo; y las diferencias que más se confunden: pivote o interior, interior o mediapunta, central o lateral, lateral o extremo, extremo o delantero, mediapunta o delantero, con un dibujo de la zona del pivote y la del interior), qué hace cada puesto en el 4-2-3-1 (versión para ti), sistemas y las cuatro fases del juego.\n- **Técnica:** disparo, conducción, pase y control, cubrir el balón, segundas jugadas, comunicación, picardía e intensidad.\n\n### Más › Planificación\n- **🗣️ Para explicar a los jugadores:** la idea de cada quincena en palabras suyas (qué significa, la palabra del equipo y cómo sabremos que lo hacemos), la semana (lunes día de la idea, martes del esfuerzo, jueves de la chispa, sábado partido) y las **4 fases de cada entreno** (Calentamos, Aprendemos, Jugamos y Cerramos). Abajo, el texto listo para **Copiar**.\n- **🖨️ Dossier: sistema y sesiones** (en el plan de 8 semanas): nuestro 1-4-2-3-1 y todas las sesiones preparadas, semana a semana, con hoy trabajamos y por qué, horario, cada tarea con su diagrama y el final. Si una sesión tiene una propuesta 📝 pendiente, sale la versión de la propuesta. **🖨️ PDF del dossier** › Guardar como PDF.\n- **Tipo de trabajo › «Por sesión y por tarea»:** los minutos analíticos (A), globales (G) y sistémicos (S) de cada sesión y de cada tarea, para ver dónde ajustar el reparto.\n- Primero, siempre abierto, el **plan de 8 semanas:** un concepto de Táctica cada quincena (la fila de hoy sale marcada).\n- **Semana tipo** y **fases de la temporada**, en tablas cortas.\n- **Tipo de trabajo:** el reparto analítico, global y sistémico se calcula de las sesiones que tienes preparadas (con tus cambios y las propuestas aceptadas), comparado con el objetivo 10-50-40.\n- Reparto de trabajo y **contenidos trabajados**: arriba, los imprescindibles que faltan; la tabla completa, en «Ver la tabla completa».\n- Reunión semanal con coordinación.\n\n### Pizarra\n- **🎬 Ejercicios animados:** en Pizarra › Ejercicios, el desplegable «🎬 Ejercicios animados…» carga ejercicios ya hechos con varios pasos y un texto en cada paso (de momento, **Bloque defensivo: basculación y robo** y **Nuestro 1-4-2-3-1**). **▶ Ver** los anima paso a paso con su texto. Se guardan como pizarras tuyas.\n- **🎬 Verlo en la pizarra:** debajo de cada tarea de las sesiones (junto a los vídeos) y en Táctica › 🧭 Nuestro 1-4-2-3-1. Abre la tarea en la pizarra: las tareas con un ejercicio animado hecho lo cargan; el resto se anima solo con sus flechas (cada pase o carrera es un paso).\n- **Texto de cada paso:** ⚙️ Pizarras, fondo y pasos › «Texto de este paso». Así puedes guardar tus propios ejercicios explicados, paso a paso.\n- Arriba, **Once** o **Ejercicios**.\n- **Ejercicios:** campo en vertical y grande; **⛶** lo pone a pantalla completa (✕ para salir). Elige una pieza abajo (🔵 Jugador, 🔴 Rival, 🟡 Comodín, ⚫ Portero, ⚽ Balón, 🔶 Cono, 📍 Pica) y **toca el campo** para ponerla; **arrastra cualquier pieza para moverla**. ➡️ Pase, ⤳ Carrera y ⬜ Zona: arrastra de origen a destino. 🧽 Borrar: toca la pieza.\n- **Pasos para simular:** **+ Paso** copia lo que hay; mueves a los jugadores (por ejemplo, el bloque bascula hacia el balón) y **▶ Ver** lo anima. **↶** deshace. En **⚙️ Pizarras, fondo y pasos**: varias pizarras con nombre, **«Desde el diagrama de una tarea…»** para partir del dibujo de una tarea, el fondo y limpiar. Al acabar, **Guardar** en la barra negra.\n- **Once:**\n- Elige el **sistema** (4-2-3-1, 4-1-4-1, 4-4-2…). En cada puesto salen primero los jugadores que **encajan** por posición; los demás, como «excepción».\n- Arrastra los jugadores en el campo. Al soltar sale abajo la barra **Guardar / Cancelar**: «Cancelar» los devuelve a donde estaban.\n- Debajo: **equilibrio del once** (perfiles) y **roles de balón parado** (lanzadores, barrera, rematadores, cierre de contra).\n\n### Más › Calendario 📅\n- Las **30 jornadas** de la liga (primera y segunda vuelta), con fecha, hora, 🏠 casa o ✈️ fuera y el próximo partido marcado.\n- Arriba: partidos jugados, puntos y goles. Lo mismo sale en Inicio, en la tarjeta **Liga**. **🌐 Ver en la FCF** abre la competición en la web de la FCF (clasificación, resultados de todos y actas).\n- **📋 Clasificación y resultados de la FCF (una vez por semana, 1 minuto):** 🌐 Ver en la FCF › pestaña **RESULTATS** (elige la jornada) o **CLASSIFICACIÓ** › mantén pulsado el texto › **Seleccionar todo** › **Copiar** › vuelve a la app › Calendario › pega en el cuadro › **Leer**. Puedes pegar las dos pestañas, una detrás de otra. La app actualiza nuestros resultados, **las fechas y horas que haya cambiado la FCF** y la **clasificación**; al tocar una jornada verás la posición y los puntos del rival. La FCF no deja que la app lo lea sola.\n- El **próximo partido** es el primero sin resultado: en cuanto guardas el partido con su resultado (o lo escribes aquí), Inicio y Partido pasan al siguiente.\n- **Resultados:** se ponen solos con los de la FCF y con los partidos que guardas en Partido. Toca una jornada para ver el campo, escribir el resultado a mano (**nosotros-ellos**, por ejemplo 2-1) o **⏱ Preparar este partido**, que pone el rival en Partido.\n\n### Más › Historial\n- **Partidos:** cada partido con su jornada, 🏠/✈️ y el resultado en color (verde victoria, amarillo empate, rojo derrota). Tócalo y tienes, en desplegables, **convocados y minutos** (con titular, cuándo sale y cuándo entra cada uno), bajas, no convocados y **cambios** (⬇ sale en rojo, ⬆ entra en verde). **✏️ Corregir este partido:** resultado, **Once inicial** (⇄ para cambiar a un titular), cambios por ventana (arriba el que sale, en rojo; abajo el que entra, en verde), **+ Ventana / + Descanso** y, en **Acta y bajas**, quitar del acta a quien al final no jugó › **✅ Aplicar** › **Guardar**. El resto de tarjetas del Historial van plegadas, con «Abrir todo» arriba.\n- **Datos de posicionamiento:** la tabla partido a partido, para ver si el equipo mejora.\n- **Minutos de la temporada:** minutos de cada jugador; **PJ 3/4** = ha jugado 3 de los 4 partidos en los que estaba convocado (en rojo si alguno se quedó sin jugar) y el **%** de los minutos que podía jugar en esos partidos. Sirve para repartir minutos con justicia.\n- **Sesiones:** las sesiones con pase de lista o terminadas: presentes, faltas, esfuerzo y tareas hechas o saltadas.\n- **Asistencia por jugador:** presentes, justificadas y faltas, el porcentaje (en rojo si baja del 75 %) y los últimos días con puntos de colores.\n\n---\n\n## PRIORIDAD 3 · De vez en cuando\n\n| Pestaña (en «Más») | Para qué |\n|---|---|\n| **Jugadores** | Tres botones arriba. **Plantilla:** nombres, dorsales, posición principal, **otras posiciones**, pie y minutos; toca el título de una columna para **ordenar** (▲▼) por dorsal, nombre, posición o minutos. Bajo cada nombre, **«Elegir perfil ▾»**: cualidades, **todas las posiciones que puede jugar** (toca las que quieras; la Pizarra las tiene en cuenta para proponerlo en cada puesto y el Partido las muestra en la lista), pie, velocidad, sprint y notas. Aquí están las **copias de seguridad**. **Jugador:** toca un dorsal arriba y ves **todo de ese jugador**: datos, minutos, asistencia y semáforo, fortalezas y qué mejorar, **3 prioridades de mejora** con sus tareas, **objetivos**, progreso, tests y **entrevistas de 5 minutos**. **Seguimiento:** el grupo entero (objetivos activos, última entrevista y prioridades) y el mapa de lo que más se repite. |\n| **Pendientes** | **Añadir** tus pendientes (con grupo: club, familias, material…), marcarlos como hechos y **Guardar**. Las hechas pasan abajo, con la fecha. También está la lista inicial (club, material…). |\n| **Mensajes** | Plantillas para familias y club: rellenas los datos y copias. |\n| **Grupo y normas** | **Normas del equipo** para jugadores y para familias, con el compromiso del cuerpo técnico. En «Propuestas de los jugadores» escribes las que añadan ellos (una por línea) › **Guardar**, y salen en el **📲 Mensaje de normas para las familias**, listo para **Copiar**. También: capitanía rotativa, grupitos y **equipos mixtos**, ánimo y frases que suman, termómetro del ánimo, **🤝 Juegos de equipo** (8 juegos con diagrama: azules y rojos, pañuelo con balón, la cadena, roba colas, carretillas, el rey del cuadrado, balonmano a 10 pases y récord del equipo), tus **12 claves como entrenador** y los valores. |\n\n---\n\n## PRIORIDAD 4 · Consulta (cuando tengas tiempo)\n\nTodas con los textos en **desplegables cerrados** y «Abrir todo» arriba.\n\n| Pestaña | Qué hay |\n|---|---|\n| **Activación y prevención** | Golpe en la cabeza y teléfonos de emergencia, coordinación para la activación, fuerza en Infantil (qué sí y qué no), isométricos con dosis, FIFA 11+ y registro de lesiones. |\n| **Balón parado** | Córners, faltas laterales, faltas frontales y saques de banda: 3 variantes en ataque y 2 en defensa de cada uno, **con su diagrama**. |\n| **Reglamento** | Reglas FCF de Infantil S14 y gestión del partido. |\n| **Biblioteca** | Los 10 temas investigados, con conclusión, recomendaciones y fuentes. |\n| **Vídeos** | **🎬 Vídeos de las tareas de las sesiones** (por día, los de las próximas sesiones), perfiles de Instagram valorados (para qué sirve cada uno y para quién) y vídeos por tipo de tarea. |\n| **Nutrición** | Consejos para las familias. |\n| **Ayuda** | Esta guía. Se actualiza sola con cada versión de la app. |\n\n---\n\n## Tu formación como entrenador: por dónde empezar\n\nPor temas, en el orden en que los vas a necesitar. Uno o dos por semana, de 20-30 minutos cada uno, y al día siguiente lo pruebas en el campo.\n\n| Cuándo | Tema | Dónde en la app | Al acabar tienes que saber… |\n|---|---|---|---|\n| 1ª semana | **1 · Cómo enseñar** | Táctica › Cómo enseñar (⭐ Lo esencial y «Cómo enseñarlo: teoría y práctica») | 10 % hablar y 90 % jugar; preguntar antes de explicar; «¡Quieto!» como mucho 3 veces; elogiar la idea, no solo el gol |\n| 1ª semana | **2 · Defender juntos** | Táctica › Posicionamiento › 5 y 6; Pizarra › Ejercicios › ⚙️ › «Desde el diagrama de una tarea» › «Línea de 4 contra 5 pasadores» | Líneas a 10-12 m; uno aprieta y el otro cubre; cuándo saltamos todos |\n| Antes del 1er partido | **3 · El partido** | Reglamento; esta guía › Partido; Táctica › 🧩 Los puestos explicados | Ventanas de cambios, todos juegan, qué hace cada puesto del 4-2-3-1 |\n| 2-8/11 | **4 · Varios partidos seguidos** | Planificación (semana tipo y tipo de trabajo); Activación y prevención | El día antes de un partido, suave; repartir minutos; prevención los lunes; golpe en la cabeza |\n| 2-8/11 | **5 · Balón parado** | Balón parado (roles y jugadas dibujadas) | El córner defensivo mixto y 2 jugadas ofensivas de memoria |\n| 9-22/11 | **6 · Perfilarse y ofrecerse** | Táctica › Posicionamiento › 2 y 3; Táctica › Técnica | Mirar antes de recibir, salir de la sombra, el tercer hombre |\n| 23/11-6/12 | **7 · Salida de balón** | Táctica › Posicionamiento › 4 (5 salidas dibujadas) | Cuándo salir en corto y cuándo en largo; dónde se ofrece el pivote |\n| Cuando puedas | **8 · El grupo y tú** | Grupo y normas (12 claves, cohesión y ánimo); Táctica › 🏛️ Canteras de referencia | Cómo hablar al grupo, corregir en privado y qué copiamos de las canteras |\n\n**Después de cada partido (10'):** Historial › el partido; 2 cosas buenas y 1 a mejorar; decide qué tarea del lunes las trabaja.\n\n## Cómo leer las pantallas\n\n- **Desplegables:** en todas las pestañas los bloques se pliegan y despliegan tocando su título, y arriba tienes **«Abrir todo / Cerrar todo»**. Lo principal de cada pantalla (la plantilla, la ficha del jugador, los partidos, el plan de 8 semanas) sale abierto, pero «Cerrar todo» también lo pliega. En el Calendario se abre sola la vuelta del próximo partido.\n- **Diagramas de las tareas:** azul = tu equipo · rojo = rival o defensores · amarillo = comodín · naranja = conos · flecha continua = pase · flecha discontinua = desplazamiento.\n- **Barra de progreso en el campo:** 🟩 tarea hecha · 🟥 saltada · 🟦 la de ahora.\n- **Banco de tareas:** 🧭 = del concepto de la quincena · ⭐ = de la idea de la semana.\n- **Pase de lista:** Sí = viene · Just. = falta justificada · No = falta. Tocar otra vez la misma opción la quita.\n- **Semáforo:** 🟢 bien · 🟡 molestia (menos saltos, esprints y frenadas ese día) · 🔴 dolor (sin impactos y avisar a la familia para que consulte al pediatra).\n- **Historial › Asistencia:** los puntos son los últimos días: verde presente, amarillo justificada, rojo falta. En rojo, quien baja del 75 %.\n- **Historial › Datos de posicionamiento:** salidas limpias y robos en 5 s, cuanto más altos mejor; superados entre defensas y goles con hueco sin cubrir, cuanto más bajos mejor. Compara cada mes contigo mismo.\n- **Plantilla:** la posición, el pie y la velocidad parten de tu valoración; el test del martes 27/10 la confirma. Sprint = segundos en 20 m. Min = minutos acumulados en partidos guardados.\n- **Programa individual (en la ficha del jugador):** hasta 3 prioridades, trabajadas dentro de los entrenos (no son deberes). Progreso de 1 a 5 cada dos semanas.\n- **Entrevistas de 5 minutos:** privadas, un minuto por pregunta; empieza por lo positivo, habla con datos, no compares con compañeros y acaba con un objetivo claro. Siempre en un sitio visible o con otro adulto cerca (protección del menor). 2-3 por sesión durante la activación.\n- **Mensajes:** rellena los datos, revisa el texto y copia. Las partes con ___ son para completar. Lo que va al grupo de familias, que pase por el criterio del club.\n- **Copias automáticas:** como mucho una cada 30 minutos al guardar cambios, y siempre al guardar un partido, terminar una sesión y antes de importar, reiniciar o borrar. Se guardan las 10 últimas.\n\n---\n\n## Preguntas rápidas\n\n- **No me deja cambiar de pestaña.** Tienes cambios sin guardar: pulsa **Guardar** o **Cancelar** en la barra negra.\n- **No me deja empezar el entreno.** Falta pasar lista a alguien o pulsar Guardar («✅ Todos presentes» lo hace en un toque).\n- **Se me ha quedado un partido o una sesión a medias.** Partido: «🗑 Descartar» (si ya terminó) o «✕ Cancelar este partido». Sesión: En el campo › «↺ Reiniciar sesión».\n- **¿Dónde están los partidos que ya jugué?** Más › **Historial**.\n- **¿Qué significan ⏳ y 📝 en las fechas de Sesión?** ⏳: sesión preparada por mí que aún no has validado. 📝: tengo una propuesta de cambio esperando que la aceptes o la rechaces.\n- **¿Dónde está lo que antes era Plantilla, Fichas o Programa individual?** Todo en **Más › Jugadores**. **Técnica y táctica** y **Posicionamiento** están juntas en **Táctica**; **Coordinación** y **Prevención**, en **Activación y prevención**; **Normas** y **Cohesión**, en **Grupo y normas**.\n- **Llueve o vienen pocos.** Sesión › Antes › **🆘 Plan B**.\n- **He cambiado de móvil o he reinstalado la app.** Más › Jugadores › Plantilla › pega tu última copia (de Samsung Notes, Drive o WhatsApp) en el cuadro «SUB14COPIA:…» › **Importar**.\n- **He borrado algo sin querer.** Más › Jugadores › Plantilla › Copias automáticas › **«Volver aquí»** en la de antes del error. Lo que tenías justo antes también se guarda, por si te equivocas de copia.\n- **Quiero ver los datos en el PC.** En el móvil, «📤 Compartir copia». En el PC, abre la misma dirección, pega la copia › **Importar** (o **Fusionar** si ya tienes datos).\n- **No veo algo que dice la guía.** Mira la versión arriba (al lado del nombre). Si es antigua: cierra la app del todo y ábrela otra vez.\n- **La app no se actualiza.** Ciérrala del todo y ábrela otra vez. Si sigue igual, ábrela una vez en Chrome con la dirección y vuelve al icono.\n- **Sin cobertura en el campo.** Funciona igual: todo se guarda en el móvil.\n"/*FINGUIA*/;
function mdInline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a class="lk" href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s)]+)/g,'$1<a class="lk" href="$2" target="_blank" rel="noopener">$2</a>');}
function mdToHtml(md){
  var L=String(md||'').split(/\r?\n/),out=[],card=null,list=null,tbl=null,intro=[];
  function flushList(){if(list){card.push('<'+list.t+'>'+list.i.join('')+'</'+list.t+'>');list=null;}}
  function flushTbl(){if(tbl){var h=tbl[0],rows=tbl.slice(2);card.push('<div class="sc"><table><tr>'+h.map(function(c){return '<th>'+mdInline(c)+'</th>';}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+mdInline(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>');tbl=null;}}
  function close(){flushList();flushTbl();if(card){out.push('<div class="card">'+card.join('')+'</div>');card=null;}}
  L.forEach(function(l){
    var t=l.trim();
    if(/^# /.test(t))return;
    if(/^## /.test(t)){close();card=['<h2>'+mdInline(t.slice(3))+'</h2>'];return;}
    if(!card){if(t&&t!=='---')intro.push(t);return;}
    if(t==='---'){flushList();flushTbl();return;}
    if(/^\|/.test(t)){flushList();tbl=tbl||[];tbl.push(t.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}));return;}
    flushTbl();
    if(/^### /.test(t)){flushList();card.push('<h3>'+mdInline(t.slice(4))+'</h3>');return;}
    var mu=/^[-*] (.*)$/.exec(t),mo=/^\d+\. (.*)$/.exec(t);
    if(mu||mo){var ty=mu?'ul':'ol';if(!list||list.t!==ty){flushList();list={t:ty,i:[]};}list.i.push('<li>'+mdInline((mu||mo)[1])+'</li>');return;}
    if(/^\s{2,}[-*] /.test(l)&&list){list.i.push('<li style="margin-left:18px">'+mdInline(t.replace(/^[-*] /,''))+'</li>');return;}
    flushList();if(t)card.push('<p>'+mdInline(t)+'</p>');
  });
  close();
  return (intro.length?'<div class="card keep">'+intro.map(function(x){return '<p class="note">'+mdInline(x.replace(/^[-*] /,''))+'</p>';}).join('')+'</div>':'')+out.join('');
}

 T({tipo:'tec',ca:'Medio campo',idea:'Defender cerrados',t:"Coordenadas visuales: dónde estoy, a dónde voy y a dónde vuelvo",d:"15'",tt:"Basculación del bloque según dónde está el balón: cada jugador conoce su sitio de salida y el sitio al que va cuando el balón está a la izquierda, a la derecha o cuando hay que subir.",co:"Activación ligera: desplazamientos cortos de frente, laterales y de espaldas.",so:"El central dirige en voz alta: «¡Izquierda!», «¡Derecha!», «¡Arriba!».",de:"4 defensas y 2 pivotes en medio campo. Cada jugador tiene un cono azul de origen (su posición) y tres conos de llegada de otro color: izquierda, derecha y adelante (subir). Tres comodines con balón: izquierda, centro y derecha. Si el balón va al comodín de la izquierda, todos a su cono de la izquierda; a la derecha, al de la derecha; si el comodín del centro da un pase atrás, todos al cono de adelante. Con «¡Vuelve!», todos al origen. Cuatro pasos: 1) andando, con el balón en la mano del entrenador; 2) al trote, con pases entre comodines; 3) se quitan los conos de llegada y solo quedan los de origen; 4) entran 2 atacantes que intentan recibir entre líneas.",re:"4 bloques de 3 min (uno por paso)",dr:"45 s",es:"Medio campo, todo el ancho",ob:"Que se muevan todos a la vez y lleguen antes que el balón; que miren al balón y al compañero de al lado, no al cono. En el paso 3 se ve si lo han entendido.",

function mezclar(n){
  var pl=S.players.slice(),i,j,t;
  for(i=pl.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=pl[i];pl[i]=pl[j];pl[j]=t;}
  var gk=pl.filter(function(p){return p.pos==='Portero';}),rest=pl.filter(function(p){return p.pos!=='Portero';});
  var cnt={};rest.forEach(function(p){var g=S.sg[p.id]||'-';cnt[g]=(cnt[g]||0)+1;});
  rest.sort(function(a,b){var ga=S.sg[a.id]||'-',gb=S.sg[b.id]||'-';return (cnt[gb]-cnt[ga])||(ga<gb?-1:(ga>gb?1:0));});
  var teams=[];for(i=0;i<n;i++)teams.push({m:[],g:{}});
  function place(p){var g=S.sg[p.id]||'-',best=0,bs=1e9;teams.forEach(function(tm,k){var s=(tm.g[g]||0)*100+tm.m.length;if(s<bs){bs=s;best=k;}});teams[best].m.push(p.id);teams[best].g[g]=(teams[best].g[g]||0)+1;}
  gk.forEach(place);rest.forEach(place);
  return teams.map(function(tm){return tm.m;});
}

/* ---------- Sincronización con el servidor ---------- */
var SYNC_KEY='sub14_sync',syncMsg='',syncBusy=false;
function sCfg(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{};}catch(e){return {};}}
function sSet(c){try{localStorage.setItem(SYNC_KEY,JSON.stringify(c));}catch(e){}}
function sPayload(){var o={};Object.keys(S).forEach(function(k){if(!NOSYNC[k])o[k]=S[k];});o._ts=S._ts;return o;}
function sApply(st){Object.keys(st).forEach(function(k){if(k==='_ts'||NOSYNC[k])return;if(k==='match'&&S.match&&S.match.running)return;S[k]=st[k];lastJ[k]=JSON.stringify(S[k]);});S._ts=st._ts||{};}
function sApi(c,path,opt){opt=opt||{};opt.headers={'X-PIN':c.pin||'','Content-Type':'application/json'};return fetch(c.url.replace(/\/+$/,'')+path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;});});}
function syncNow(silent){
  var c=sCfg();
  if(!c.url&&/^https?:$/.test(location.protocol))c.url=baseUrl();
  if(!c.url||!c.pin){if(!silent){syncMsg='Falta la dirección o el PIN.';render();}return;}
  if(syncBusy)return;syncBusy=true;
  if(!c.device){c.device='disp-'+Math.random().toString(36).slice(2,8);sSet(c);}
  var choques=[],p;
  if(!c.rev){
    p=sApi(c,'/api/state').then(function(r){
      if(r.rev>0&&r.state){
        if(silent)throw new Error('primera sincronización pendiente: pulsa Sincronizar ahora');
        if(!confirm('El servidor ya tiene datos. Aceptar = descargar los del servidor y SUSTITUIR los de este dispositivo. Cancelar = no sincronizar.'))throw new Error('cancelado');
        sApply(r.state);c.rev=r.rev;return r;
      }
      return sApi(c,'/api/state',{method:'POST',body:JSON.stringify({base_rev:0,state:sPayload(),device:c.device})}).then(function(r2){c.rev=r2.rev;return r2;});
    });
  }else{
    p=sApi(c,'/api/state',{method:'POST',body:JSON.stringify({base_rev:c.rev,state:sPayload(),device:c.device})}).then(function(r){sApply(r.state);c.rev=r.rev;choques=r.choques||[];return r;});
  }
  p.then(function(){
    sSet(c);save();var d=new Date();
    syncMsg='Sincronizado a las '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' (versión '+c.rev+').'+(choques.length?' Se cambió lo mismo en dos dispositivos ('+choques.join(', ')+'): se ha conservado lo más reciente.':'');
  }).catch(function(e){
    syncMsg='No se pudo sincronizar: '+(/Failed to fetch|NetworkError|Load failed/.test(e.message)?'sin conexión con el servidor':e.message);
  }).then(function(){
    syncBusy=false;var ae=document.activeElement;
    if(!(S.match&&S.match.running)&&(S.tab==='plantilla'||S.tab==='jug'||!ae||!/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
  });
}
function baseUrl(){return (location.origin+location.pathname).replace(/[^\/]*$/,'').replace(/\/+$/,'');}
/* App instalable y sin conexión cuando se sirve por HTTPS (por ejemplo, detrás del dominio de la app de referencia) */
if(/^https?:$/.test(location.protocol)){
  try{var mf=document.createElement('link');mf.rel='manifest';mf.href='manifest.webmanifest';document.head.appendChild(mf);
    var tc=document.createElement('meta');tc.name='theme-color';tc.content='#1C3F94';document.head.appendChild(tc);}catch(e){}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
  var ss=sCfg();if(!ss.url){ss.url=baseUrl();sSet(ss);}
}

/* ---------- Importar y fusionar copias (archivo o texto) ---------- */
function doImport(o){
  if(!o||!o.players)throw new Error('copia no válida');
  snapTake('Antes de importar',true);
  S=o;normS();if(S.match&&S.match.running){S.match.running=false;S.match.lastTs=Date.now();}DIRTY=false;SNAP=null;hideSaveBar();save();render();toast('Copia importada: '+S.players.length+' jugadores','ok');
}
function doMerge(o){
  if(!o||!o.players)throw new Error('copia no válida');
  snapTake('Antes de fusionar',true);
  var its=o._ts||{},ch=[];
  Object.keys(o).forEach(function(k){
    if(NOSYNC[k])return;
    if(!(k in S)){S[k]=o[k];S._ts[k]=its[k]||0;lastJ[k]=JSON.stringify(S[k]);return;}
    if(JSON.stringify(S[k])===JSON.stringify(o[k]))return;
    if((its[k]||0)>(S._ts[k]||0)){S[k]=o[k];S._ts[k]=its[k];lastJ[k]=JSON.stringify(S[k]);ch.push(k);}
  });
  normS();if(S.match&&S.match.running){S.match.running=false;S.match.lastTs=Date.now();}save();
  syncMsg='Copia fusionada: '+(ch.length?'se tomaron de la copia estos apartados, por ser más recientes: '+ch.join(', ')+'.':'no había apartados más recientes en la copia.')+' Se mantiene lo de este dispositivo en el resto.';
  render();toast(ch.length?'Copia fusionada ('+ch.length+' apartados nuevos)':'Copia fusionada: no había nada más reciente','ok');
}

/* Copias automáticas dentro del móvil: protegen de errores (borrar algo sin querer), no de perder el móvil */
var SNAPKEY='sub14_snaps',lastSnap=0;
function snapList(){try{return JSON.parse(localStorage.getItem(SNAPKEY)||'[]');}catch(e){return [];}}
(function(){var a=snapList();lastSnap=a.length?a[0].t:0;})();
function snapTake(motivo,force){
  try{
    var now=Date.now();if(!force&&now-lastSnap<30*60000)return;
    var a=snapList(),d=JSON.stringify(S);if(a.length&&a[0].d===d)return;
    a.unshift({t:now,m:motivo||'',d:d});a=a.slice(0,10);
    try{localStorage.setItem(SNAPKEY,JSON.stringify(a));}catch(q){a=a.slice(0,4);localStorage.setItem(SNAPKEY,JSON.stringify(a));}
    lastSnap=now;
  }catch(e){}
}

function cdRem(){var c=S.cd;if(!c)return 0;return c.end?Math.max(0,Math.ceil((c.end-Date.now())/1000)):(c.rem||0);}
function cdAlarm(){
  try{if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);}catch(e){}
  try{if(cdCtx){[0,0.45,0.9].forEach(function(o){var g=cdCtx.createGain(),osc=cdCtx.createOscillator();osc.frequency.value=880;osc.connect(g);g.connect(cdCtx.destination);g.gain.setValueAtTime(0.4,cdCtx.currentTime+o);g.gain.setValueAtTime(0,cdCtx.currentTime+o+0.3);osc.start(cdCtx.currentTime+o);osc.stop(cdCtx.currentTime+o+0.32);});}}catch(e){}
}
function cdStart(sec,l){
  try{var A=window.AudioContext||window.webkitAudioContext;if(A){cdCtx=cdCtx||new A();if(cdCtx.resume)cdCtx.resume();}}catch(e){}
  if(l!=='Pausa de agua')S.cdPrev=null;
  S.cd={l:l,dur:sec,end:Date.now()+sec*1000,rem:null,done:false};save();wl(true);cdShow();
}
function cdShow(){
  var bar=$('#cdbar');if(!bar)return;var c=S.cd;
  if(!c){bar.className='';bar.innerHTML='';bar.removeAttribute('data-k');document.body.classList.remove('cdon');return;}
  var r=cdRem();
  var acaba=false;if(c.end&&r<=0&&!c.done){c.done=true;save();cdAlarm();acaba=true;
    /* Al acabar el agua, la tarea sigue sola desde donde estaba */
    if(c.l==='Pausa de agua'&&S.cdPrev){var cP=S.cdPrev;S.cdPrev=null;cP.end=Date.now()+(cP.rem||0)*1000;cP.rem=null;cP.done=false;S.cd=c=cP;r=cdRem();save();toast('Seguimos con la tarea','info');}}
  var k=(c.done?'d':(c.end?'r':'p'))+'|'+c.l+'|'+(S.cdPrev?1:0);
  if(bar.getAttribute('data-k')!==k){
    bar.setAttribute('data-k',k);
    bar.innerHTML='<span class="t"></span><span class="l">'+esc(c.l)+(c.done?' · ¡Tiempo!':(c.end?'':' · en pausa'))+'</span>'+
     (c.done?'':'<button data-act="cdp">'+(c.end?'⏸ Pausa':'▶ Seguir')+'</button>')+'<button data-act="cdplus">+1\'</button>'+
     (S.cdPrev?'<button data-act="cdresume" style="background:#C8102E;color:#fff">▶ Volver a la tarea</button>':'')+'<button data-act="cdx">✕</button>';
  }
  var tc=$('#tclock'),fS=FICH[S.ses],tS=fS&&fS.tareas[(S.sstep||0)-1];
  var aqui=S.tab==='sesiones'&&S.sesv==='campo'&&tS&&c.l===('Tarea '+S.sstep+' · '+tS.t);
  if(aqui){bar.className='';document.body.classList.remove('cdon');}
  else{bar.className='show'+(c.done?' fin':'');document.body.classList.add('cdon');}
  bar.querySelector('.t').textContent=clock(r);
  if(tc)tc.textContent=clock(r);
  if(acaba&&S.tab==='sesiones'&&S.sesv==='campo'&&!DIRTY)render();
}
