 {h:"Antes de salir (19:30-19:55)",l:[
  "Material: 12 setas y 20 platillos, 3 juegos de petos, 8-10 balones, 2 minipuertas (o 4 setas), cronómetro, pizarra, hojas de observación y agua.",
  "Marcar con platillos: 3 cuadrados de 10x10 m para los rondos, una pista de 20 m para el test y medio campo con porterías para el bloque.",
  "Reparto: Tu ayudante lleva los rondos y toma los tiempos del test; tú diriges el bloque defensivo y el partido; el coordinador, si está, observa.",
  "Los jugadores llegan a las 19:50. La charla es a las 19:55 en el vestuario (6 min) para estar en el campo a las 20:00.",
  "Ten a mano la lista con la posición de cada jugador para repartir los equipos sin pensar."]},
 {h:"1. Charla (6 min, vestuario)",l:[
  "Usa el guion corto: qué sigue igual, qué pides, qué prometes. Termina con \"¿qué quieres mejorar?\".",
  "No hables de titulares, sistemas, del entrenador anterior ni de familias."]},
 {h:"2. Activación (12 min)",l:[
  "6' Rondo 5v1 en 3 cuadrados de 10x10 (6 jugadores por cuadrado, porteros incluidos). Máximo 2 toques. Quien pierde el balón o es tocado pasa al centro. Rotación del defensor cada 45\".",
  "6' Movilidad en parejas con balón: pase y desmarque, giros, carreras cortas de 5-8 m y cambios de dirección.",
  "Observa quién presiona en el rondo sin que se lo pidas: es tu primer dato de esfuerzo.",
  "Corrige poco: una frase, con ánimo."]},
 {h:"3. Test de velocidad (8 min)",l:[
  "Pista de 20 m con dos conos. Salida de pie detrás del primer cono, a tu \"ya\". Dos intentos por jugador con 2 minutos de descanso entre ellos. Se apunta el mejor.",
  "Grupos de 3 y siempre el mismo cronometrador (tu ayudante). El error con cronómetro manual es de unos 0,2 s: sirve para ordenar, no para medir décimas.",
  "Mientras esperan, el central zurdo, los defensas y los porteros hacen el pase largo de 25-30 m: 2 con cada pie. Apunta con qué pie golpea cada uno.",
  "Anota todo en la columna Sprint de la pestaña Plantilla."]},
 {h:"4. Bloque defensivo 4-2-3-1 (22 min)",l:[
  "Equipo A (11): portero, 4 defensas, 2 pivotes, 3 medios y 1 delantero. Equipo B (7): lo que queda, con 6 de campo y 1 portero.",
  "8' sin oposición: un entrenador mueve el balón a izquierda, derecha y atrás. El bloque se desplaza como una sola pieza. Cuando gritas \"¡Quieto!\" todos se congelan y compruebas distancias.",
  "14' con oposición: B ataca con 6 y A defiende. 3 oleadas de 4' con 1' de pausa. B suma 1 punto por tiro; A suma 1 punto por recuperar y salir con un pase a las dos minipuertas de medio campo.",
  "Puntos clave: líneas a 10-12 m entre sí. Ayuda al lado del balón y el lado contrario cierra hacia dentro. El pivote juega delante de la línea, no dentro. El delantero cierra el pase interior. No saltar solo: se presiona en grupo. El portero habla y manda.",
  "Observa en especial la pareja de centrales, cómo se coloca el central más lento respecto a la línea, quién ayuda en la banda y quién cierra el pase interior."]},
 {h:"5. Partido 9v9 (20 min)",l:[
  "Dos equipos de 9: cada uno con un portero y 8 de campo en 1-3-2-2-1. Equilibra los equipos con tus notas.",
  "Regla: gol tras recuperar con 3 pases o menos vale doble.",
  "10' en la posición habitual. A mitad del partido, cada jugador cambia de puesto (defensas al medio, medios a banda, delanteros atrás) para ver quién rinde fuera de su sitio.",
  "Observa quién presiona, quién abandona su puesto, cómo se comunican y cómo reaccionan al perder el balón."]},
 {h:"6. Balón parado y vuelta a la calma (7 min)",l:[
  "3' córner defensivo: 2 jugadores en los palos, 1 en el primer palo, 2 en zona delante del portero y el resto marcando al hombre.",
  "3' estiramientos.",
  "1' mensaje final: qué has visto bien y qué trabajas mañana (duelos)."]},
 {h:"Después de la sesión (10 min)",l:[
  "Rellena la hoja de observación de esta pestaña para cada jugador, mientras lo tienes fresco.",
  "Contrasta con tu ayudante: 5 minutos, solo lo que habéis visto los dos.",
  "Si alguien ha faltado, anota quién y por qué."]},
 {h:"Si algo falla",l:[
  "Lluvia: la charla se alarga a 10 minutos, haces el bloque defensivo en espacio reducido bajo cubierta o saltas el test.",
  "Menos de 14 jugadores: rondo 4v1, bloque 9v6 y partido 7v7.",
  "Lesión: parada de 2 minutos, avisa al delegado y apunta la molestia.",
  "Hidratación: 1 minuto de agua entre bloques."]}
 ]},
 {t:'2 · Mar 27/10 · 1/4 campo',obj:'Duelos y posición defensiva',b:['5\' charla corta','12\' rondos 4v2 con presión (9\') y coordinación con balón (3\')','25\' 1v1 y 2v2 defensivos con apoyo, en rotación (laterales y centrales juntos)','22\' 4v4+3 comodines (10\') y partido modelo de juego 9v9 (12\')','8\' córner y saque de banda defensivos (4\') y ronda de tiros desde la frontal (4\')','3\' cierre'],det:[
 {h:"Antes de salir (19:30-19:55)",l:[
  "Revisa los tiempos del test y las notas del lunes. Ajusta con eso las parejas defensivas y los equipos de hoy.",
  "Material: 20 conos y platillos, 3 juegos de petos, 8-10 balones, 4 minipuertas (o 8 setas), 2 porterías, cronómetro, hojas de observación y agua.",
  "Marca 4 pasillos de 8x15 m para los 1v1, un área de 20x25 m con una portería para el 2v2 y otra de 30x35 m para el 4v4+3.",
  "Reparto: Tu ayudante lleva el rondo y los pasillos; tú diriges el 2v2 y el 4v4+3; el coordinador, si está, controla tiempos y agua.",
  "Carga: es el día siguiente a la sesión 1. Mantén la intensidad alta pero con pausas: 1' de agua entre bloques y rotaciones cortas."]},
 {h:"1. Charla (5 min, vestuario)",l:[
  "Una cosa buena que viste el lunes (concreta y sin señalar a nadie) y el objetivo de hoy: defender uno contra uno y ayudarnos entre compañeros.",
  "Enseña en la pizarra dos ideas: perfil del defensor (cuerpo de lado, empuja hacia la banda) y qué hace el compañero que ayuda (cubre por detrás y a un lado).",
  "Cierra con una pregunta: ¿quién quiere ser el primero en el pasillo?"]},
 {h:"2. Activación (12 min)",l:[
  "6' Rondo 4v2 en 3 cuadrados de 8x8 (6 jugadores por cuadrado). Máximo 2 toques. Quien pierde el balón pasa al centro y los del centro rotan al recuperar.",
  "6' Rondo con regla de presión: quien pierde el balón presiona 5 segundos antes de que se le deje salir. Cuenta cuántas presiones hace cada uno sin que se lo pidas.",
  "Observa quién presiona tras perder y quién se queda parado: es tu dato de esfuerzo sin balón de hoy."]},
 {h:"3. Parte I: duelos (25 min)",l:[
  "13' 1v1 defensivo en 4 pasillos de 8x15 m con minipuerta (o portero) al fondo. El atacante recibe un pase del entrenador y ataca; el defensor sale de frente. Cada uno defiende 6 veces y rota. Los porteros defienden la puerta en dos pasillos.",
  "Puntos clave 1v1: perfil de lado y empujar hacia la banda; distancia de 1,5-2 m y frenar antes del contacto; no lanzarse a robar, esperar el toque largo.",
  "12' 2v2 con apoyo, portería y portero: dos defensores contra dos atacantes y un comodín del equipo atacante. Parejas defensivas reales (central con central, lateral con central) que practican el \"yo-tú\": uno sale a presionar y el otro cubre por detrás y habla.",
  "Puntos clave 2v2: el que presiona se hace ver y ordena; el que cubre se coloca detrás y a un lado; tras el robo, salida rápida hacia los dos rápidos.",
  "Rota las parejas cada 90 segundos para ver con quién rinde mejor cada uno, sobre todo la pareja de centrales",
  "Observa: cuerpo de lado o de frente, quién se lanza, quién habla y quién ayuda sin que se lo pidan."]},
 {h:"4. Parte II: 4v4+3 (22 min)",l:[
  "Espacio de 30x35 m. Dos equipos de 4 y tres comodines que siempre juegan con quien tiene el balón (7 contra 4). Dos minipuertas o dos zonas de pase por equipo.",
  "3 rondas de 6' con 1' de agua. Cada equipo suma 1 punto cada 8 pases seguidos; si lo pierde, los de enfrente intentan recuperar y salir en 3 pases hacia una minipuerta.",
  "Condición: quien pierde el balón presiona 5 segundos.",
  "Puntos clave: líneas de pase cerradas, presión en grupo, no saltar solo y cobertura detrás del que presiona.",
  "Reparto: mezcla los equipos con tus notas de ayer para que defensas y rápidos se enfrenten y los veas en duelos reales."]},
 {h:"5. Balón parado y vuelta a la calma (8 min)",l:[
  "3' repaso del córner defensivo mixto visto el lunes.",
  "2' saque de banda defensivo: un jugador marca al receptor y el más cercano presiona.",
  "2' estiramientos.",
  "1' mensaje final: qué has visto bien y qué toca el jueves (transiciones y el once para el sábado)."]},
 {h:"Después de la sesión (10 min)",l:[
  "Rellena la observación: esfuerzo, posición y rendimiento por jugador.",
  "Contrasta con tu ayudante: parejas defensivas que funcionan, laterales que defienden mejor y quién no da señales de esfuerzo sin balón.",
  "Anota lesiones o molestias y avisa al delegado si las hay."]},
 {h:"Si algo falla",l:[
  "Lluvia: la charla se alarga a 10 minutos y los pasillos 1v1 se hacen en espacio más corto.",
  "Menos de 14 jugadores: pasillos de 3, 2v2 sin comodín y 3v3+2.",
  "Lesión: parada de 2 minutos, avisa al delegado y apunta la molestia.",
  "Fatiga evidente: reduce las rondas a 5' o salta la tercera."]}
 ]},
 {t:'3 · Jue 29/10 · medio campo',obj:'Transiciones, balón parado y decisión del once para Torelló (sáb 31/10)',b:['5\' charla corta: se confirma la convocatoria del sábado','12\' rondo (5\'), coordinación con balón (3\') y relevos de reacción (4\')','14\' oleadas con centros, remates y definición (analítico)','11\' recuperar y salir en 3 pases hacia los rápidos (los extremos rápidos)','22\' 7v7 (10\') y partido 9v9 con estrategia (12\')','8\' córner ofensivo y defensivo, ensayado con el equipo del sábado','3\' cierre. Decidir con tu ayudante: portero, pareja de centrales y laterales para Torelló'],det:[
 {h:"Antes de salir (19:30-19:55)",l:[
  "Repasa tus notas de las sesiones 1 y 2, los tiempos del test y los minutos del historial. Anota tu once probable y dos alternativas para cada puesto defensivo.",
  "Material: 20 conos y platillos, 3 juegos de petos, 8-10 balones, 2 porterías, 4 minipuertas, cronómetro, hojas de observación y agua.",
  "Marca una zona de 40x35 m con dos porterías para las transiciones y dos zonas de 30x30 m para los rondos.",
  "Reparto: Tu ayudante lleva los rondos y la activación; tú diriges las transiciones y el 7v7; el coordinador, si está, controla agua y descansos.",
  "Carga: es la última sesión antes del partido. Intensidad alta y volumen corto: que acaben frescos."]},
 {h:"1. Charla (5 min, vestuario)",l:[
  "Una cosa buena del martes y el objetivo de hoy: recuperar el balón y salir rápido.",
  "Informa de la convocatoria del sábado (partido contra Torelló a las 13:45 en casa; quedada a la hora que confirme el club, sugerencia 12:45). No anuncies el once.",
  "Cierra con tres ideas para el sábado: esfuerzo, ayudarse y hablar."]},
 {h:"2. Activación (12 min)",l:[
  "6' Rondo 4v2 en cuadrados de 8x8, con la regla de presión de 5 segundos tras perder.",
  "6' Activación competitiva: relevos de reacción con balón en 10-15 m, por parejas y a la señal. Esfuerzos de 6 segundos con 30 segundos de descanso. Corto e intenso.",
  "Observa quién se activa solo y quién necesita que se lo pidan."]},
 {h:"3. Parte I: recuperar y salir (25 min)",l:[
  "5' Patrón sin oposición: el portero saca a un central, pase a un pivote y pase vertical al corredor (un extremo rápido), que finaliza. Repite por los dos lados.",
  "10' Con oposición: bloque A (portero, 4 defensas, 2 pivotes y 1 delantero) contra 6 atacantes B. B ataca; cuando A recupera, tiene 3 pases como máximo para llegar al corredor y finalizar en la portería contraria.",
  "10' Cambio de roles: ahora defiende el otro grupo. Rota a los rápidos entre los dos equipos para que todos prueben el papel de corredor.",
  "Puntos clave: primer pase seguro, segundo hacia delante, tercero al corredor. El corredor arranca en el momento de la recuperación y el resto sube en bloque sin dejar huecos.",
  "Observa quién levanta la cabeza antes de pasar, quién se ofrece sin que se lo pidan y qué pareja de centrales sale mejor."]},
 {h:"4. Parte II: 7v7 (22 min)",l:[
  "Dos equipos de 7 (portero y 6 de campo) en 40x35 m con dos porterías. Los 4 jugadores restantes descansan y rotan cada ronda, de modo que nadie descansa dos rondas.",
  "3 rondas de 7' con 1' de agua. Equipos mixtos y equilibrados con tus notas, sin petos fijos de \"titulares\" para no anunciar el once.",
  "Reglas: gol tras recuperar en 3 pases o menos vale doble y quien pierde el balón presiona 5 segundos.",
  "Puntos clave: bloque compacto sin balón, presión en grupo y salida rápida con la cabeza arriba.",
  "Observa en especial la pareja de centrales y los dos laterales que puedes usar el sábado."]},
 {h:"5. Balón parado y cierre (8 + 3 min)",l:[
  "5' Córner ofensivo, variante 1: lanzador en la esquina contraria a su pierna buena, dos atacantes altos al primer palo, uno al segundo y un llegador en el borde del área. Señal: brazo arriba.",
  "3' Córner defensivo mixto con el equipo que prevés para el sábado.",
  "3' Cierre: estiramientos y un mensaje corto: el sábado vamos a competir. Recuerda hidratación y comida (pestaña Nutrición)."]},
 {h:"Después de la sesión: decisión del once (20 min con tu ayudante)",l:[
  "Portero: decide quién abre. Criterios: seguridad y comunicación, juego con los pies, rendimiento en entrenos y estado de forma. El otro va convocado y con minutos.",
  "Defensa: elige pareja de centrales y dos laterales con los tiempos del test, los duelos del martes y las salidas de hoy. No cambies más de un puesto respecto al once que tengas en mente.",
  "Pivotes y medios: dos pivotes que protejan a la defensa. Ataque: dos velocidades arriba y alguien que reciba y conecte.",
  "Anota el once en la pestaña Pizarra y la convocatoria en Partido."]},
 {h:"Plan de minutos para el sábado",l:[
  "Acta de hasta 20. Con 18 convocados hay 11 titulares y 7 suplentes, y todos los inscritos deben participar (FCF).",
  "Cambios: el descanso no gasta ocasión; haz ahí 3-4 cambios. En la 2ª parte tienes 3 ocasiones y cambios volantes (puedes reentrar).",
  "Reparto orientativo de las 3 ocasiones: minuto 50, 58 y 65 del partido, con 2 cambios cada vez.",
  "Avisa antes a los suplentes para que se calienten y entra cada uno con una tarea clara.",
  "El cronómetro de la app cuenta los minutos de cada jugador y avisa de quién no ha jugado."]},
 {h:"Logística del sábado",l:[
  "Manda el mensaje a las familias con la plantilla \"Convocatoria de partido\" (31/10, 13:45, CEM Les Cremades, quedada a la hora que confirme el club).",
  "Confirma con el coordinador quién presenta el acta y los dorsales de las camisetas.",
  "Lleva pizarra, hoja de minutos, botiquín, balones y agua. Comidas según la guía: desayuno hacia las 8:30-9:00, comida ligera hacia las 11:00-11:30 y fruta hacia las 13:00.",
  "Es tu primer partido: no cambies el sistema ni lo expliques en exceso. Tres ideas bastan."]},
 {h:"Si algo falla",l:[
  "Lluvia: charla de 10 minutos y las salidas se ensayan en espacio reducido.",
  "Menos de 14 jugadores: transiciones con bloque 6v4 y 5v5 con portero.",
  "Lesión: parada de 2 minutos, avisa al delegado y apunta la molestia. Si hay dudas físicas sobre un jugador para el sábado, decídelo el viernes.",
  "Hidratación: 1 minuto de agua entre bloques."]}
 ]},
 {t:'4 · Lun 2/11 · campo entero',obj:'Balance del partido de Torelló y salida de balón',b:['5\' charla: balance del sábado, dos cosas buenas y una a mejorar','12\' rondo 5v2 (4\') y circuito de coordinación y prevención (8\')','25\' salida sin oposición (8\') y con presión: 6v4 (8\') y 11v7 (9\')','22\' 9v9 con franjas (10\') y partido modelo de juego (12\')','8\' faltas laterales, ofensivo y defensivo','3\' cierre'],det:[
 {h:"Antes de salir (19:30-19:55)",l:[
  "Guarda el partido de Torelló en la pestaña Partido (resultado y minutos) y revisa quién jugó poco o nada: hoy debe haber equilibrio en las tareas.",
  "Material: 20 conos y platillos, 3 juegos de petos, 8-10 balones, 2 porterías, 4 minipuertas, cronómetro, hojas de observación y agua.",
  "Marca una zona de salida de 40x30 m y otra de 55x45 m con tres franjas (defensa, medio y ataque) para el 9v9.",
  "Reparto: Tu ayudante lleva la activación y la salida sin oposición; tú diriges la salida con presión y el 9v9; el coordinador, si está, controla agua y descansos.",
  "Carga: es el día después del partido. Volumen moderado y foco técnico-táctico. Pregunta por molestias del sábado antes de empezar."]},
 {h:"1. Charla (5 min, vestuario)",l:[
  "Balance de Torelló: dos cosas buenas y una a mejorar, sin nombres. Pregunta cómo se sintieron y escucha a 2 o 3 jugadores.",
  "Objetivo de hoy: salir jugando con calma y con claridad.",
  "Cierra con una frase: de lo que salió bien, esto repetimos."]},
 {h:"2. Activación (12 min)",l:[
  "6' Rondo 5v2 en dos cuadrados de 10x10 (9 jugadores por cuadrado, porteros incluidos). Máximo 2 toques.",
  "6' Pases largos y control orientado en tríos (portero y dos jugadores): pase de 20-25 m y control hacia el espacio.",
  "Observa si la intensidad del rondo ha subido respecto a la primera semana."]},
 {h:"3. Parte I: salida de balón (25 min)",l:[
  "8' Salida sin oposición: portero, 2 centrales, 2 laterales y 1 pivote. Tres patrones: salida por central y lateral, salida por el pivote y pase largo al corredor (un extremo rápido) si hay presión.",
  "17' Con presión: portero, 4 defensas y 1 pivote contra 3 o 4 presionadores. Rondas de 4' con cambio de roles. El objetivo es superar la línea de presión y llegar a una zona de pase al medio.",
  "Puntos clave: el portero es un jugador más; los centrales se abren; el pivote baja a recibir de frente; si hay presión alta, balón largo al corredor.",
  "Observa quién se ofrece sin que se lo pidan, la salida del central con buen pie, el pie del central zurdo y la comunicación del portero."]},
 {h:"4. Parte II: 9v9 con zonas (22 min)",l:[
  "Dos equipos de 9 (portero y 8 de campo) en 55x45 m con tres franjas. El balón debe pasar por la franja del medio antes de entrar en la de ataque.",
  "3 rondas de 6' con 1' de agua. Gol tras pasar por las tres franjas vale doble. Quien pierde el balón presiona 5 segundos.",
  "Equipos mixtos y equilibrados con tus notas de la semana.",
  "Puntos clave: ofrecerse entre líneas, cabeza arriba antes de recibir y los laterales abren el campo.",
  "Observa quién busca el pase vertical y quién se queda con el balón."]},
 {h:"5. Balón parado y cierre (8 + 3 min)",l:[
  "4' Falta lateral ofensiva: centro al segundo palo y pase atrás al borde del área.",
  "4' Falta lateral defensiva: línea baja en zona con el portero ordenando y los rápidos fuera.",
  "3' Cierre: estiramientos y mensaje: mañana preparamos el partido del jueves."]},
 {h:"Después de la sesión",l:[
  "Rellena la observación de cada jugador y compárala con la de las sesiones 1 a 3.",
  "Con tu ayudante: balance de la semana, minutos reales del sábado, lesiones y qué cambiarías para Centelles.",
  "Anota un borrador del once para Centelles. Se confirma mañana, en la sesión 5."]},
 {h:"Si algo falla",l:[
  "Lluvia: la charla se alarga a 10 minutos y la salida se trabaja en un espacio más corto.",
  "Menos de 14 jugadores: salida 5v3 y 7v7 con zonas.",
  "Lesión: parada de 2 minutos, avisa al delegado y apunta la molestia.",
  "Fatiga tras el partido: acorta las rondas del 9v9 a 5'."]}
 ]},
 {t:'5 · Mar 3/11 · 1/4 campo',obj:'Preparar Centelles y cerrar decisiones',b:['5\' charla: plan para Centelles (rival directo de permanencia)','12\' rondo 4v2 (6\'), coordinación (3\') y cambios de ritmo (3\')','25\' 3v3+2 y 4v4+3; duelos aéreos y de espalda','22\' partido con el once previsto para Centelles y automatismos de transición','8\' balón parado: faltas frontales, saque de banda ofensivo y repaso del córner defensivo','3\' cierre. Decisión final: sistema, centrales, laterales, portero y convocatoria'],det:[
 {h:"Antes de salir (19:30-19:55)",l:[
  "Estudia al rival: Centelles es 12º con 3 puntos y un rival directo de permanencia. Mira sus resultados y goleadores en la web de la FCF (grupo 4) y pregunta a quien los haya visto si juegan largo, si tienen un delantero rápido y cuántos goles encajan.",
  "Material: 20 conos y platillos, 3 juegos de petos, 8-10 balones, 2 porterías, 4 minipuertas, cronómetro, hojas de observación y agua.",
  "Marca dos zonas de 20x20 m para el 3v3+2 y una de 40x35 m con dos porterías para el partido.",
  "Reparto: Tu ayudante lleva la activación y el 3v3+2; tú diriges los duelos aéreos y el partido; el coordinador, si está, controla agua y descansos.",
  "Carga: el partido es en dos días. Volumen corto y calidad, sin contactos fuertes."]},
 {h:"1. Charla (5 min, vestuario)",l:[
  "Plan para Centelles en tres ideas: bloque compacto, presión en grupo y salida rápida hacia los rápidos.",
  "Importancia del partido sin presión: es un rival directo, pero se gana competiendo, no con ansiedad.",
  "Avisa de la logística (quedada y transporte) cuando la tengas confirmada por el club."]},
 {h:"2. Activación (12 min)",l:[
  "6' Rondo 4v2 con presión de 5 segundos tras pérdida.",
  "6' Activación con balón y cambios de ritmo en 10-15 m.",
  "Observa quién llega concentrado y quién necesita un empujón."]},
 {h:"3. Parte I: conservación y duelos (25 min)",l:[
  "12' 3v3+2 comodines en 20x20 m. Los comodines siempre juegan con quien tiene el balón. Rotaciones cada 3'. Objetivo: conservar y salir de la presión.",
  "13' Duelos aéreos y de espalda: los centrales y el pivote contra dos delanteros que reciben centros desde las bandas. El defensor gana el primer balón y su equipo, el segundo. 6 repeticiones por jugador.",
  "Puntos clave aéreos: ver el balón y al rival, tocar antes de saltar y si no se gana, ir a la segunda jugada.",

function drawBoard(){
  var c=$('#cv');if(!c)return;var g=c.getContext('2d'),W=c.width,H=c.height;
  g.clearRect(0,0,W,H);

  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;
  g.strokeRect(10,10,W-20,H-20);
  g.beginPath();g.moveTo(10,H/2);g.lineTo(W-10,H/2);g.stroke();

function cvXY(e){var c=$('#cv'),r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100];}
function dragStart(e){
  var c=$('#cv');if(!c||e.target!==c)return;

function mezclar(n){
  var pl=S.players.slice(),i,j,t;
  for(i=pl.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=pl[i];pl[i]=pl[j];pl[j]=t;}
  var gk=pl.filter(function(p){return p.pos==='Portero';}),rest=pl.filter(function(p){return p.pos!=='Portero';});
  var cnt={};rest.forEach(function(p){var g=S.sg[p.id]||'-';cnt[g]=(cnt[g]||0)+1;});
  rest.sort(function(a,b){var ga=S.sg[a.id]||'-',gb=S.sg[b.id]||'-';return (cnt[gb]-cnt[ga])||(ga<gb?-1:(ga>gb?1:0));});
  var teams=[];for(i=0;i<n;i++)teams.push({m:[],g:{}});
  function place(p){var g=S.sg[p.id]||'-',best=0,bs=1e9;teams.forEach(function(tm,k){var s=(tm.g[g]||0)*100+tm.m.length;if(s<bs){bs=s;best=k;}});teams[best].m.push(p.id);teams[best].g[g]=(teams[best].g[g]||0)+1;}
  gk.forEach(place);rest.forEach(place);
  return teams.map(function(tm){return tm.m;});

var FASES=["Ataque organizado","Defensa organizada","Transición ataque-defensa (al perder)","Transición defensa-ataque (al recuperar)"];

var SISTEMAS=[
 ["4-2-3-1 (base)","Doble pivote que protege la defensa y tres creativos detrás de un punta. Encaja con tus tres pivotes y los dos rápidos arriba. Riesgo: el delantero queda aislado si los de detrás no suben."],
 ["4-1-4-1","Un pivote y cuatro medios. Muy compacto para defender. Menos presencia ofensiva: el punta necesita mucho apoyo."],
 ["4-4-2 en línea","Dos delanteros (si tienes dos delanteros rápidos) y dos líneas de cuatro. Fácil de entender. Riesgo: los dos medios centro quedan desbordados."],
 ["4-4-2 rombo","Pivote, dos interiores y un mediapunta. Centro del campo fuerte. Poca amplitud: los laterales deben subir."],
 ["4-3-3","Extremos abiertos y amplitud. Exige un pivote fuerte, laterales con recorrido y que los extremos defiendan. Encaja con tus extremos rápidos."],
 ["4-2-2-2","Dos pivotes, dos mediapuntas por dentro y dos puntas. Muy compacto en el centro, con laterales que suben."],
 ["3-5-2 y 3-4-3","Línea de tres atrás con carrileros. Exigen centrales rápidos y mucha resistencia en los carrileros. Ahora no los recomiendo: con centrales lentos y 11 goles encajados, se arriesga demasiado."]];
var PRESION=[["Presión alta","Línea adelantada y presión en campo rival. Gana el balón cerca de la portería, pero deja espacio a la espalda."],["Presión media","Bloque en el centro del campo; se presiona al pasar la línea del medio. Es el equilibrio recomendable."],["Presión baja","Bloque cerca de la propia área, con 10-12 m entre líneas. Seguro, pero cede territorio."],["Disparadores de presión","Pase atrás, mal control del rival y balón que va a la banda. Cuando se dispara, presionan los más cercanos y el resto cierra."]];
var SALIDAS=[["Salida corta","Por los centrales y los laterales con el portero como apoyo. Para cuando el rival no presiona alto."],["Por el pivote","Un pivote baja entre los centrales o recibe de cara. Para superar una presión media."],["Portero más tres","Un pivote se mete entre los centrales para formar línea de tres y dejar libres a los laterales."],["Pase largo al corredor","Balón directo a un extremo rápido con segunda jugada preparada. Para presión alta del rival."]];

/* ---------- Sincronización con el servidor ---------- */
var SYNC_KEY='sub14_sync',syncMsg='',syncBusy=false;
function sCfg(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{};}catch(e){return {};}}
function sSet(c){try{localStorage.setItem(SYNC_KEY,JSON.stringify(c));}catch(e){}}
function sPayload(){var o={};Object.keys(S).forEach(function(k){if(!NOSYNC[k])o[k]=S[k];});o._ts=S._ts;return o;}
function sApply(st){Object.keys(st).forEach(function(k){if(k==='_ts'||NOSYNC[k])return;if(k==='match'&&S.match&&S.match.running)return;S[k]=st[k];lastJ[k]=JSON.stringify(S[k]);});S._ts=st._ts||{};}
function sApi(c,path,opt){opt=opt||{};opt.headers={'X-PIN':c.pin||'','Content-Type':'application/json'};return fetch(c.url.replace(/\/+$/,'')+path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;});});}
function syncNow(silent){
  var c=sCfg();
  if(!c.url&&/^https?:$/.test(location.protocol))c.url=baseUrl();
  if(!c.url||!c.pin){if(!silent){syncMsg='Falta la dirección o el PIN.';render();}return;}
  if(syncBusy)return;syncBusy=true;
  if(!c.device){c.device='disp-'+Math.random().toString(36).slice(2,8);sSet(c);}
  var choques=[],p;
  if(!c.rev){
    p=sApi(c,'/api/state').then(function(r){
      if(r.rev>0&&r.state){
        if(silent)throw new Error('primera sincronización pendiente: pulsa Sincronizar ahora');
        if(!confirm('El servidor ya tiene datos. Aceptar = descargar los del servidor y SUSTITUIR los de este dispositivo. Cancelar = no sincronizar.'))throw new Error('cancelado');
        sApply(r.state);c.rev=r.rev;return r;
      }
      return sApi(c,'/api/state',{method:'POST',body:JSON.stringify({base_rev:0,state:sPayload(),device:c.device})}).then(function(r2){c.rev=r2.rev;return r2;});
    });
  }else{
    p=sApi(c,'/api/state',{method:'POST',body:JSON.stringify({base_rev:c.rev,state:sPayload(),device:c.device})}).then(function(r){sApply(r.state);c.rev=r.rev;choques=r.choques||[];return r;});
  }
  p.then(function(){
    sSet(c);save();var d=new Date();
    syncMsg='Sincronizado a las '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' (versión '+c.rev+').'+(choques.length?' Se cambió lo mismo en dos dispositivos ('+choques.join(', ')+'): se ha conservado lo más reciente.':'');
  }).catch(function(e){
    syncMsg='No se pudo sincronizar: '+(/Failed to fetch|NetworkError|Load failed/.test(e.message)?'sin conexión con el servidor':e.message);
  }).then(function(){
    syncBusy=false;var ae=document.activeElement;
    if(!(S.match&&S.match.running)&&(S.tab==='plantilla'||!ae||!/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
  });
}
function vSync(){
  var c=sCfg(),def=(location.protocol==='http:'||location.protocol==='https:')?baseUrl():'';
  return '<div class="card"><h2>Sincronización con el servidor</h2><p class="note">Los datos se guardan siempre en este dispositivo. Al sincronizar se envían al servidor del trabajo y se traen los de otros dispositivos. Solo funciona con la red del trabajo; en el campo sigue funcionando sin conexión.</p><div class="row"><label class="note">Dirección <input type="text" data-sync="url" value="'+esc(c.url||def)+'" placeholder="http://192.168.x.x:5000" style="width:230px"></label> <label class="note">PIN <input type="password" data-sync="pin" value="'+esc(c.pin||'')+'" style="width:90px"></label></div><div class="row"><button class="b" data-act="syncnow">Sincronizar ahora</button></div><p class="note">'+esc(syncMsg||(c.rev?('Última versión: '+c.rev):'Sin sincronizar todavía.'))+'</p></div>';
}
function baseUrl(){return (location.origin+location.pathname).replace(/[^\/]*$/,'').replace(/\/+$/,'');}
/* App instalable y sin conexión cuando se sirve por HTTPS (por ejemplo, detrás del dominio de la app de referencia) */
if(/^https?:$/.test(location.protocol)){

function doImport(o){

  S=o;normS();DIRTY=false;SNAP=null;hideSaveBar();save();render();toast('Copia importada: '+S.players.length+' jugadores','ok');
}
function doMerge(o){
  if(!o||!o.players)throw new Error('copia no válida');
  var its=o._ts||{},ch=[];
  Object.keys(o).forEach(function(k){
    if(NOSYNC[k])return;
    if(!(k in S)){S[k]=o[k];S._ts[k]=its[k]||0;lastJ[k]=JSON.stringify(S[k]);return;}
    if(JSON.stringify(S[k])===JSON.stringify(o[k]))return;
    if((its[k]||0)>(S._ts[k]||0)){S[k]=o[k];S._ts[k]=its[k];lastJ[k]=JSON.stringify(S[k]);ch.push(k);}
  });
  normS();save();
  syncMsg='Copia fusionada: '+(ch.length?'se tomaron de la copia estos apartados, por ser más recientes: '+ch.join(', ')+'.':'no había apartados más recientes en la copia.')+' Se mantiene lo de este dispositivo en el resto.';
  render();toast(ch.length?'Copia fusionada ('+ch.length+' apartados nuevos)':'Copia fusionada: no había nada más reciente','ok');
}

var BIB_T=[
 {t:"Tema 1 · Gestión del vestuario y cohesión",
  con:"El vestuario se gestiona con tres palancas, por este orden: el clima que creas (esfuerzo, mejora y refuerzo), la estructura social (romper cliques pronto, equipos mixtos, roles, identidad y liderazgo) y las normas de protección del menor. Con tu equipo, empieza por el clima: es lo que mejor respaldan los estudios y lo más barato de aplicar.",
  ev:["Un clima orientado a la tarea (maestría) se asoció con más disfrute y menos abandono en 2.150 voleibolistas y 799 nadadores; el clima orientado al rendimiento tuvo poco efecto [1].","En 809 jóvenes futbolistas de 11,5 años de media, el clima centrado en la tarea se relacionó con más cohesión de tarea y social, y el clima centrado en el ego con menos cohesión de tarea [6].","Los entrenadores formados en Coach Effectiveness Training premian más el esfuerzo y sus jugadores mantienen más la práctica; la evidencia viene sobre todo de los propios autores [5].","Los subgrupos son inevitables y cambian con el tiempo; lo negativo son las cliques. Entrenadores de élite distinguen entre subgrupo y clique y siguen las relaciones del equipo para fomentar o reducir [4].","Un resumen de Sports Coach UK recomienda dejar que estén con sus amigos en parte de la sesión, reforzar entre iguales, desalentar las burlas, usar objetivos de grupo y romper pronto las cliques, que suelen aparecer tras derrotas o cuando el entrenador trata distinto a los jugadores [2].","El libro The Power of Groups in Youth Sport reúne capítulos sobre cohesión, subgrupos y team building en deporte juvenil [3].","Las familias influyen en los roles, las cliques y la cohesión (31 entrevistas a entrenadores y padres) [23].","El conflicto entre compañeros se asocia con menos cohesión y el clima de tarea del entrenador y de los compañeros con más [22].","El mal liderazgo de los deportistas es uno de los seis problemas que citan los entrenadores con adolescentes; un curso para capitanes de 13-19 años se valoró útil [16].","Hay sesgo de selección hacia los que maduran antes y los entrenadores también lo sufren al juzgar; se recomienda individualizar por maduración [17].","Protocolo catalán (leído): evitar que los menores usen móviles personales en el vestuario, comunicar que no se pueden hacer fotos dentro, valorar cómo se informa de la entrada del responsable al vestuario, evitar espacios totalmente cerrados sin visión desde fuera, preferir la comunicación grupal a la bilateral, pactar el contacto telefónico y limitarlo a temas de actividad, no tener favoritismos y designar un delegado de protección al que los menores puedan acudir [8].","En actividades con menores conviene que haya siempre al menos dos personas acompañando [8]. La FA inglesa exige dos adultos verificados en toda actividad [9]."],
  lim:["Casi todo es correlacional y de otros deportes (voleibol, natación, hockey); no he visto ensayos controlados de intervenciones de cohesión en fútbol de 13-14 años.","Varios estudios los he leído solo en resumen y las fuentes 6, 15 y 17 son las más débiles.","Lo sobre derrotas es divulgación y no investigación [18].","La regla de dos adultos en el vestuario no es de la FA según lo que encontré; la base es el protocolo catalán, que lo plantea como valoración y prevención. Confirma con el coordinador cómo lo concreta el club."],
  rec:[["1. Clima de maestría","Metas de esfuerzo y mejora; reconoce el esfuerzo; el error es permitido. No enseñes rankings ni la hoja de observación a los jugadores."],["2. Más refuerzo que corrección","Corrige en privado y refuerza en público. En una tesis de fútbol juvenil de élite se observó un 4 a 1 [12]; úsalo como referencia, no como regla."],["3. Subgrupos","Anota los grupos en la app, forma siempre equipos mixtos y permite estar con amigos solo en parte del calentamiento. Rompe pronto las cliques, sobre todo tras una derrota, y no trates distinto a nadie, también con familiares."],["4. Liderazgo","Capitanía rotativa, habla con los líderes informales y da al capitán de la semana tareas claras."],["5. Derrotas","Metas de proceso (presión de 5 s, comunicación, distancias), cuida cómo pierdes tú, no sobreexpongas a los mejores y usa los partidos desequilibrados para probar posiciones."],["6. Familias","Canal único de comunicación y mensajes neutros; sin contacto privado con jugadores."],["7. Maduración","Antes de dar a un jugador por lento o pequeño, mira su maduración y habla con él."],["8. Protección","Aplica las normas del protocolo catalán y pide al coordinador el documento de aceptación y el nombre del delegado de protección."]],
  pro:["Lunes: actualizar el mapa de grupos y generar equipos mixtos para la semana.","Cada sesión: saludo ritual al empezar y al terminar, y al menos un comentario positivo individual a cada jugador.","Cierre: cada jugador dice su mejor acción.","Viernes: termómetro del ánimo y revisión de grupos.","Cada mes: entrevista de 5 minutos con cada jugador.","Siempre: sin móviles ni fotos en el vestuario, adultos a la vista y comunicación por el grupo."],
  ind:["Termómetro del ánimo de 4 o más.","Parejas y equipos mezclados entre grupos.","Número de quejas por trato o por grupitos.","Nota de esfuerzo de la hoja de observación."]},
 {t:"Tema 2 · Gestión de un partido",
  con:"En el partido tu trabajo es preparar, soltar y reforzar: preparas antes la rotación y los roles, durante el juego hablas poco (una instrucción cada vez, mucho refuerzo y silencio) y en el descanso das tres mensajes y haces una o dos preguntas. Todos juegan (lo exige la FCF) y la evidencia, aún parcial, relaciona jugar más con disfrutar más.",
  ev:["The FA recomienda planificar la rotación la noche anterior, repartiendo el tiempo de juego y variando las posiciones, y usar el calentamiento para recordar objetivos y roles [13].","Las guías de la FA piden que los adultos animen más y griten menos, con las familias detrás de la línea, sin insultos y aceptando las decisiones del árbitro [14].","Seis entrenadores juveniles de élite pasaron la mayor parte del tiempo en silencio, con instrucciones breves y refuerzo [11].","En una tesis de fútbol juvenil de élite (U12 a U19), la relación entre feedback positivo y negativo fue de unos 4 a 1, y los más jóvenes disfrutaban más [12].","En la charla de descanso de cinco entrenadores de una academia predominaron la instrucción y el feedback; los de categorías menores usaron más preguntas y más participación de los jugadores, y consultaron con su staff antes de entrar al vestuario [10].","Un estudio en español identificó contenidos estratégicos y psicológicos en las charlas de entretiempo [21].","En rugby juvenil, quienes jugaban al menos medio partido contaban más disfrute y más intención de seguir; el efecto de los minutos sobre el abandono no está comparado entre políticas [15].","Protestar de forma ostensible o insistente al árbitro se sanciona con 1 a 4 partidos, y el sábado y el domingo cuentan como una jornada de sanción [19].","Reglas FCF verificadas: 70 minutos, acta de 20, cambios volantes (3 ocasiones más el descanso), todos los inscritos deben jugar, área técnica solo con licencia y dorsales de hasta dos dígitos [19]."],
  lim:["Hay muy pocos estudios de fútbol de 13-14 años en partidos de club; las muestras son de una academia o de seis entrenadores.","Las duraciones de las charlas (60-90 segundos) son criterio mío, no de un estudio.","No hay evidencia sólida sobre cuándo y cómo hacer los cambios.","Varias fuentes son inglesas: sirven como buenas prácticas, no como normativa."],
  rec:[["Noche anterior","Convocatoria y mensaje a las familias, rotación y plan de minutos con posiciones variadas, y hoja de partido preparada."],["Una hora antes","Llegada del equipo, acta revisada con el delegado y dorsales."],["Calentamiento (20 min)","Con roles y objetivos recordados; 3 acciones de balón parado."],["Charla previa (60-90 s)","Tres ideas: esfuerzo, ayudarse y comunicación (o la prioridad de la semana)."],["Durante el partido","Una instrucción cada vez, frases cortas y positivas con nombre y acción. Usa el silencio. Mira las cuatro fases del juego. No corrijas en caliente al que falla. Habla con el árbitro solo a través del capitán y sin protestar."],["Cambios","Plan de minutos: 3 o 4 en el descanso (no gastan ocasión) y 3 ocasiones en la segunda parte. El cronómetro de la app avisa de quién no ha jugado."],["Descanso (10-15 min)","Agua y un minuto de calma; tres mensajes (lo que mantenemos, lo que cambiamos y ánimo) y una o dos preguntas a los jugadores."],["Después","Saludo, dos mensajes de dos minutos, sin análisis en caliente; 24 horas más tarde, dos cosas buenas y una a mejorar. Revisa el acta y los minutos."],["Si vas perdiendo","Metas de proceso, calma y un cambio sencillo; no culpes a nadie."],["Si vas ganando","Mantén la estructura y reparte los minutos pendientes."],["Familias","Código de conducta claro; la queja se habla después por el cauce acordado con coordinación."]],
  pro:["Guion de charla previa: esfuerzo, ayudarse y comunicación.","Guion de descanso: mantenemos, cambiamos y ánimo, más una pregunta.","Guion post-partido: saludo, dos mensajes y a casa.","Hoja de partido: rival, once, minutos, ocasiones de cambio usadas y notas (ya está en la pestaña Partido)."],
  ind:["Todos los inscritos han jugado.","Goles encajados y presiones tras pérdida.","Cambios hechos según el plan.","Sin tarjetas por protestas."]},
 {t:"Tema 3 · Metodologías de canteras",
  con:"Las canteras que funcionan no comparten un método, comparten principios: un modelo de juego claro, aprendizaje a través del juego, formación integral, trabajo individualizado y paciente, y entrenadores capacitados. Lo que casi nunca se puede trasladar es el entorno: la selección, los recursos y el tiempo. Para tu equipo, que es un club pequeño sin selección y con tres sesiones por semana, recomiendo una metodología híbrida: aprender jugando con juegos reducidos y partidos condicionados, un modelo de juego sencillo por principios, formación en valores y vestuario, y seguimiento individual por jugador.",
  tab:[["UEFA, siete países (2014)","Valida principios comunes y muestra que su aplicación cambia con la cultura de cada país","Marco para decidir: modelo de rendimiento y modelo de desarrollo [24]","Alta"],["FC Barcelona (La Masia)","La formación personal va antes que la futbolística; el concepto se juega, no se enseña; rondos y conservaciones","Valores y aprender jugando [25][26]","Media-baja"],["Ajax","Modelo TIPS (técnica, visión de juego, personalidad y velocidad); mismo sistema 4-3-3 en todas las categorías","Mirar a cada jugador con esos cuatro criterios y dar coherencia al sistema [27]","Media"],["Athletic (Lezama)","Cantera propia con formación integral y doble carrera","Formación integral: valores y estudios [28]","Media-baja"],["Real Sociedad (Zubieta)","La cantera como base de su identidad; presión agresiva sin balón; trabajo individual con delanteros","Presión tras pérdida y trabajo individual por puesto [29]","Media-baja"],["Villarreal","No he encontrado fuente sobre su metodología","Sin datos","No verificado"],["Alemania (DFB)","Reforma de las edades menores hacia formatos reducidos tipo Funino","Formatos reducidos con más toques y decisiones [30]","Media"],["Países Bajos (KNVB)","Enfoque total basado en el juego y etapas por edad (fuente secundaria)","Aprender el juego jugando con etapas flexibles [24][31]","Media-baja"],["Inglaterra (FA y EPPP)","Cuatro esquinas: técnico, físico, psicológico y social; edad cronológica y madurez","Ficha por jugador con las cuatro esquinas [32]","Media-alta"]],
  ev:["El informe de la UEFA (7 países, 41 expertos) validó un esquema de principios: modelo de rendimiento (filosofía, estilo y características del jugador), modelo de desarrollo a largo plazo con etapas, atención a lo físico, psicológico, social, técnico y táctico, selección cuidadosa, un entorno planificado y entrenadores capacitados [24].","Hay convergencia en el estilo: se valora la posesión, la velocidad, la determinación, la excelencia técnica y la inteligencia táctica, y los sistemas favoritos son el 4-3-3 y el 4-2-3-1 [24].","Hay divergencia en cómo se aplica: España seleccionaba pronto y de forma amplia, Francia y Alemania más tarde y con muestreo; Inglaterra separaba físico, psicológico, social, técnico y táctico, mientras Francia, Países Bajos y España se basaban en el juego; los Países Bajos y Alemania iban a un entrenador más facilitador y España e Italia a uno más dirigido [24].","Los autores recomiendan no aplicar sin crítica ideas de otras canteras, porque lo que funciona en un contexto puede perjudicar en otro [24].","Los expertos reconocen el valor de los juegos tácticos, los juegos reducidos, los partidos completos y los partidos con equipos desiguales [24].","Juegos reducidos: un metaanálisis encontró efectos beneficiosos sobre la ejecución técnica en jóvenes, pero pidió estudiar los efectos tácticos [33]; una revisión de 45 estudios sobre fútbol juvenil encontró que casi todos eran transversales [34].","Un piloto con 45 sub-13 encontró que el 9v9 producía más ataques hasta el último tercio y más jugadores implicados que el 11v11 [35]; en U12 un grupo de juegos reducidos mejoró más el manejo de balón y el pase que uno de metodología mixta [36].","Periodización táctica: una revisión sistemática de 2020 no encontró datos empíricos y concluyó que es prematuro respaldarla científicamente, aunque tiene argumentos a favor [37].","Juego de posición: la base revisada por pares es escasa y con muestras pequeñas, y en academias inglesas la maduración sesga quién va a los puestos defensivos [39].","Especialización y muestreo: en 294 jugadores suizos, los perfiles con mucho juego libre y práctica en club tuvieron más opciones de llegar a la selección juvenil; el estudio es retrospectivo y no resuelve el debate [38].","Alemania cambió la iniciación al Funino (3v3 en 20x27 m con cuatro porterías sin portero); un estudio de 2025 encontró más demandas físicas y técnicas que el 7v7, pero uno de los autores defendió la reforma [30].","En La Masia, según el club, la formación personal va antes que la futbolística y los conceptos se aprenden jugando [25][26]. Ajax usa el modelo TIPS y el mismo sistema en todas sus categorías [27]. La Real Sociedad trata la cantera como base de su identidad [29]. La FA propone mirar a cada jugador desde cuatro esquinas [32]."],
  lim:["Casi todo viene del fútbol profesional y de academias con selección: no hay evidencia sobre clubes pequeños de 13-14 años con tres sesiones.","Los datos de La Masia, Ajax, Lezama y Zubieta salen del club o de prensa, no de estudios independientes.","No he encontrado nada fiable del Villarreal ni un documento oficial de la KNVB: las etapas por edad son de una fuente secundaria.","Falta evidencia comparada entre juego de posición, periodización táctica y juegos reducidos; las muestras son pequeñas.","Mi lectura de la comparativa de la UEFA es de los capítulos de resumen y conclusiones, no del informe entero."],
  rec:[["1. Aprender jugando","Juegos reducidos, partidos condicionados y rondos como eje. Es lo que ya tienen tus sesiones; mantén el 10-50-40 analítico, global y sistémico."],["2. Modelo de juego por principios","Un 4-2-3-1 base, las cuatro fases del juego y las tres prioridades de dos semanas. Pocos principios, bien repetidos."],["3. Formación integral","Valores, vestuario, cohesión y estudios. Es lo que más comparten Barcelona, Athletic y Ajax y encaja con el Tema 1."],["4. Seguimiento individual","El programa individual con las cuatro esquinas de la FA: técnico, físico, psicológico y social."],["5. Respeto a la maduración","No juzgues solo por el rendimiento de hoy; los jugadores lentos o pequeños pueden ser tardíos."],["6. Moderar la instrucción","Pregunta y deja decidir, como en los países de la UEFA con entrenador facilitador."],["7. Competir con cuidado","Los partidos son aprendizaje y todos juegan."],["8. Juego libre","Anima a jugar al fútbol libre fuera del club, sin presión ni deberes obligatorios."],["Qué no copiar","La selección y captación, los sistemas únicos con el primer equipo, la periodización táctica como dogma y los ejercicios sin contexto."]],
  pro:["Decisión de modelo: metodología híbrida (juego, principios y seguimiento individual).","Cada mes: repasar el programa individual con las cuatro esquinas de cada jugador.","Cada semana: revisar el reparto analítico, global y sistémico de la pestaña Planificación.","En diciembre (fase Construir): decidir si se profundiza en juego de posición y definición."],
  ind:["Reparto de trabajo cerca de 10-50-40.","Todos los jugadores con prioridades y un objetivo personal.","Progreso registrado cada dos semanas.","Mejora de los indicadores de proceso del equipo."]},
 {t:"Tema 4 · Tipos de entrenamiento y planificación",
  con:"Para un equipo de 13-14 años con tres sesiones, recomiendo planificar por fases (Preparar, Construir y Mantener), con una semana tipo estable en la que la carga más alta cae a mitad de semana y la más baja justo antes del partido, medir la carga con una escala sencilla de esfuerzo percibido, individualizar por maduración y hacer prevención de forma regular. La evidencia es sobre todo descriptiva y de academias de élite: sirve para orientar, no para prescribir cifras.",
  ev:["En jóvenes de élite de 12 a 21 años hay poca evidencia que relacione la carga de entrenamiento con el riesgo de lesión; el esfuerzo percibido por sesión es una herramienta habitual para registrarla [40].","En cinco temporadas de una academia (U15 a U19), las dos sesiones previas al partido tuvieron menos carga, sobre todo por menos duración, y el partido fue el día de mayor carga; la duración es la palanca principal para ajustar la semana [41].","En la Serie A juvenil, los U17 y U19 entrenaban cinco veces por semana y los más jóvenes cuatro, con grandes oscilaciones de carga diaria [42].","Un estudio portugués y otro chileno de sub-21 sitúan el día más cargado tres días antes del partido y el de menor carga el día anterior; son grupos mayores que el tuyo [43].","Alrededor del pico de crecimiento aumenta el riesgo de lesiones por sobrecarga y de crecimiento. Se recomienda reestimar la maduración cada 3 o 4 meses, formar a los entrenadores en maduración y tener en cuenta que las ecuaciones tienen error [44].","En 124 jugadores de academia, la carga de lesiones varió según el momento y la velocidad del pico de crecimiento [45].","Un estudio de 34 entrenadores juveniles observó que el 41% del tiempo era juego, el 22% ejercicios, el 31% inactividad y el 6% transiciones, y que hablaban más de tres minutos antes de cada actividad; es descriptivo [46].","FIFA 11+: en 414 jugadores de 14 a 19 años redujo un 41% las lesiones totales y un 48% las de miembros inferiores, con cumplimiento del 60% de los equipos y el 74% de los jugadores, y limitaciones metodológicas [47]. En juveniles femeninas, la alta adherencia mejoró el equilibrio y redujo lesiones [48]. El ensayo con FIFA 11+ Kids existe, pero no he visto sus resultados [49].","No encontré recomendaciones oficiales de periodización por categoría. Hay ejemplos de macrociclo de pretemporada en sub-17 y de mesociclos de cuatro microciclos en sub-13, con la advertencia de respetar los límites de la edad [50].","Tipos de entrenamiento (analítico, global y sistémico) y su reparto 10-50-40 para S13/S14 vienen del plan de un club de referencia, no de estudios independientes."],
  lim:["Casi todo son datos descriptivos de academias de élite U15 a U19 o sub-21; no hay estudios de equipos de club de 13-14 años con tres sesiones.","La relación entre carga y lesiones en juveniles está poco demostrada: no hay umbrales fiables.","El ensayo del FIFA 11+ es de 14 a 19 años; en 13 años se aplica por analogía.","Las duraciones y reparto de carga que propongo son criterio mío a partir de estos datos descriptivos.","Las fuentes 41 a 43 y 45 a 46 las leí solo en resumen."],
  rec:[["1. Semana tipo estable","Lunes: carga media-alta con situaciones de partido. Martes: carga más alta en bloques cortos con balón. Jueves: carga baja o media, velocidad y balón parado. El día anterior al partido, descanso."],["2. Semana con partido entre semana","Lunes y martes como siempre, con el martes más suave, y sin sesión el día del partido."],["3. Duración como palanca","Si notas fatiga, recorta minutos antes que intensidad. En el jueves, 60-65 minutos pueden bastar."],["4. Medir la carga","Al terminar cada sesión, pregunta al grupo su esfuerzo de 1 a 10 y apunta la media y los minutos. La app lo calcula en la pestaña Sesiones."],["5. Maduración","Mide altura y peso cada tres meses, con permiso de las familias, para detectar estirones y ajustar la carga de quien los viva."],["6. Prevención regular","Hazla con constancia: la adherencia es lo que importa. Lunes y, si puedes, un bloque corto otro día."],["7. Menos inactividad","Explica en menos de un minuto, cuida las transiciones y mantén a todos jugando."],["8. Planificación por fases","Mesociclo 1 (26/10 al 20/11): intensidad y comunicación, defender cerrados y cohesión. Mesociclo 2 (desde noviembre): salida de balón, desmarques y disparo. Propuesta mía para ajustar con lo que veas."],["9. Reparto de trabajo","Mantén la referencia 10-50-40 de la pestaña Planificación, con el trabajo sistémico en el lunes y el martes."]],
  pro:["Cada sesión: apuntar esfuerzo medio y minutos.","Cada semana: mirar la suma de cargas y que el jueves sea menor que el martes.","Cada tres meses: medir altura y peso y revisar a los jugadores en estirón.","Cada mes: revisar la planificación y los contenidos que no se han trabajado."],
  ind:["Carga semanal estable, sin saltos grandes.","El jueves con menos carga que el martes.","Sin lesiones por sobrecarga.","Asistencia y cumplimiento de la prevención."]},
 {t:"Tema 5 · Desarrollo individual y rendimiento",
  con:"Para sacar el máximo de cada jugador sin sobrecargarlo, recomiendo un plan individual muy simple (una fortaleza, una cosa a mejorar y un objetivo que el propio jugador elige), revisado cada mes, con una batería corta de pruebas de campo en septiembre, enero y mayo, y con la maduración como filtro antes de comparar a nadie. La evidencia respalda dar autonomía al jugador y cuidar la maduración y la edad relativa; no hay estudios que demuestren que un plan individual por sí solo mejore resultados a esta edad.",
  ev:["No encontré estudios con resultados sobre planes individuales a los 13-14 años. Lo que hay son documentos de programas: en la Premier League cada jugador de academia tiene un plan a medida, y en la fase U12-16 se trabaja lo táctico, psicológico y social junto al dominio del balón [52]. Se recomienda revisarlo cada mes o trimestre [51].","El apoyo del entrenador a la autonomía (dejar elegir, explicar el porqué, pedir opinión) se asocia a motivación más autónoma: correlación de 0,39 en un metaanálisis de 131 muestras, y negativa con la desmotivación (−0,19) [59]. Las intervenciones para formar a entrenadores en esto suelen cambiar su conducta, aunque falta ver el efecto en los niños [60].","Dejar que el jugador fije sus objetivos se relaciona con mejor habilidad para fijarlos: en 309 jóvenes británicos, la sensación de competencia mediaba esa relación [61].","En 92 jugadores de academia de 11 a 14 años, agruparlos por maduración mejoró varias medidas psicológicas y casi no cambió las físicas; no está resuelto qué método usar [53]. Los métodos tienen límites conocidos de error [54].","En 111 jugadores de 11 a 16 años, el afrontamiento y la autoevaluación subían con la edad, y los de mejor categoría puntuaban más en afrontar la presión [55].","En 1.120 jugadores U12-U16, la edad relativa se relacionó con la maduración, la posición, el nivel competitivo y las expectativas del entrenador [56]. Es decir, el entrenador puede estar premiando al que nació antes o creció antes.","Pruebas de campo habituales en juveniles: salto con contramovimiento, sprints de 5, 10 y 30 m, Yo-Yo y esprints repetidos [57]. En sub-14, el Yo-Yo de resistencia intermitente se relacionó con el consumo máximo de oxígeno y con el tiempo en 30 m [58].","No encontré tablas de referencia por percentiles para sub-14 con esta batería."],
  lim:["Ninguna fuente demuestra que un plan individual mejore el rendimiento a esta edad; es práctica extendida, no evidencia de resultados.","La mayoría de estudios son de academias, con selección previa; tu grupo es de club.","Sin valores normativos de sub-14, las pruebas sirven para comparar a cada jugador consigo mismo, no con una tabla.","El efecto de la edad relativa lo vi en una muestra española y es asociativo.","Todas las fuentes de este tema las leí solo en resumen."],
  rec:[["1. Plan de tres líneas","Para cada jugador: una fortaleza, una cosa a mejorar y un objetivo elegido por él. Es lo que ya recoge la pestaña Programa individual."],["2. Que elija él","Pregunta antes de proponer, explica el porqué de cada ejercicio extra y deja elegir entre dos opciones. Es la parte con más respaldo."],["3. Revisión mensual","Cinco minutos por jugador al mes: ¿se ha cumplido?, ¿cómo se siente? Anótalo en la app."],["4. Pruebas en tres momentos","Octubre-noviembre, enero y mayo: salto, sprint de 10 y 30 m y una prueba de resistencia sencilla. Se compara cada uno consigo mismo."],["5. Maduración primero","Con la altura y el peso de cada tres meses, detecta quién está en el estirón y no lo compares con los demás ni le cargues de más."],["6. Cuidado con tus sesgos","Revisa cada mes cuántos minutos juega cada uno y si los que juegan más son los nacidos antes en el año o los más altos. Si es así, dalo la vuelta a propósito."],["7. Afrontar la presión","Dedica tiempo a lo mental: qué hacer tras un error, cómo reaccionar al gol en contra. La app ya lo tiene en Cohesión y Reglas."],["8. Sin comparar en público","Los resultados de las pruebas son privados de cada jugador y de sus familias."]],
  pro:["Cada mes: revisión individual de cinco minutos con cada jugador.","Cada tres meses: altura, peso y estirón.","Tres veces por temporada: pruebas de campo.","Cada mes: reparto de minutos por jugador y por fecha de nacimiento."],
  ind:["Todos los jugadores con plan y objetivo propio.","Reparto de minutos sin sesgo por edad relativa.","Mejora de cada jugador frente a sí mismo en las pruebas.","Jugadores que dicen que han podido elegir."]},
 {t:"Tema 6 · Prevención, recuperación y salud",
  con:"Para tu equipo recomiendo cuatro cosas sencillas: calentamiento preventivo fijo (FIFA 11+ o similar), vigilar a quien tenga dolor de rodilla o talón en el estirón y reducirle carga, protocolo claro ante un golpe en la cabeza (sacar al jugador y no volver el mismo día) y hablar con las familias de sueño, comida e hidratación. Todo esto es orientación general: lo debe validar un fisioterapeuta o médico del club antes de aplicarse como programa.",
  ev:["Osgood-Schlatter (dolor bajo la rodilla) es la afección de crecimiento más frecuente en jóvenes deportistas y se asocia sobre todo al fútbol y al baloncesto; la causa es multifactorial y falta evidencia sobre qué tratamiento es mejor [62][63].","La única evidencia directa de gestión de carga es un estudio de nueve jugadores de squash: con revisión semanal y reducción de carga se perdieron pocos días de entrenamiento [64]. Es muy pequeña y no es de fútbol.","Una guía clínica danesa recomienda reducir la carga durante el estirón, medir la altura cada tres meses y variar el entrenamiento para evitar movimientos repetitivos [65]. Es guía clínica, no ensayo. No encontré evidencia específica sobre la enfermedad de Sever (talón).","Sueño: un estudio de congreso con adolescentes encontró un 68% menos de lesiones en quienes dormían 8 horas o más [66], y un estudio pequeño con actigrafía en 19 atletas también halló relación [67]. Una tabla de revisión que vi citada menciona un estudio con 75 futbolistas juveniles sin relación, pero no pude leerlo. Es evidencia observacional y con sueño declarado, así que sirve para orientar, no para afirmar.","Isquiotibiales: el ejercicio nórdico aumenta la fuerza excéntrica en jóvenes, pero esa mejora no se tradujo en saltar o correr más en 23 jugadores de élite [68]. Que reduzca las lesiones en adolescentes es limitado y contradictorio; las revisiones hablan de hasta un 51% menos, con grupos control sin programa [69].","El consenso del COI sobre desarrollo atlético juvenil incluye la nutrición como componente clave [70]. Un resumen de revisión sobre jóvenes (no incluido entre las fuentes) indica que no hay ecuaciones para calcular sus necesidades de energía y que se adaptan las guías de adultos, y que los golpes de calor son más frecuentes que en adultos.","Conmoción: según el consenso de Ámsterdam, ya no se recomienda el reposo estricto; se vuelve pronto a actividad ligera y la vuelta al juego se hace por fases, tras estar sin síntomas [71].","La prevención con FIFA 11+ está en el Tema 4 [47][48]."],
  lim:["No hay un programa de prevención validado específicamente para sub-14 de club con tres sesiones.","No encontré evidencia sobre Sever; las pautas de Osgood-Schlatter se aplican por analogía.","Sueño y nutrición: evidencia observacional, con datos declarados; no se pueden dar cifras exactas para este grupo.","Del consenso del COI (fuente 70) solo vi el resumen, y del de Ámsterdam (71) un resumen de terceros, no el documento completo; para la vuelta al juego tras una conmoción hay que seguir el protocolo oficial y a un médico.","Nada de esto sustituye a un fisioterapeuta, un médico ni al protocolo del club."],
  rec:[["1. Calentamiento fijo","Haz siempre el mismo calentamiento preventivo (por ejemplo, FIFA 11+), unos 15 minutos, al menos dos días por semana. La constancia es lo que importa."],["2. Vigilar el estirón","Pregunta cada mes por dolor de rodilla o talón. A quien lo tenga, reduce saltos y esprints y avisa a la familia para que consulte al pediatra."],["3. Golpe en la cabeza","Sácalo del campo, avisa a la familia y no vuelve ese día. La vuelta al juego, solo con permiso médico y por fases."],["4. Isquiotibiales","Si lo incluyes, hazlo con poco volumen y bien explicado; no prometas que evite lesiones."],["5. Sueño","Habla con las familias de dormir lo suficiente, sobre todo antes de los partidos de sábado. No des cifras como norma médica."],["6. Comida e hidratación","Que cada jugador lleve agua a todos los entrenos y partidos; en días de calor, más pausas para beber. Pide a las familias una comida normal antes y después."],["7. Botiquín y contacto","Confirma con el club el botiquín, la mutua y quién atiende una lesión; apunta teléfonos de emergencia de cada jugador."],["8. Validación","Antes de aplicar nada como programa, que lo revise un fisioterapeuta o médico (ya anotado en Pendientes)."]],
  pro:["Cada entreno: calentamiento preventivo fijo.","Cada mes: preguntar por molestias y estirón.","Cada partido: agua, botiquín y teléfonos a mano.","Cada lesión o golpe: apuntarlo en la app y avisar a la familia."],
  ind:["Calentamiento preventivo hecho en todas las sesiones.","Ningún jugador con dolor sin carga ajustada.","Protocolo de conmoción conocido por todo el cuerpo técnico.","Familias informadas de sueño, comida e hidratación."]},
 {t:"Tema 7 · Táctica y modelo de juego",
  con:"Para tu equipo recomiendo un modelo de juego muy corto, de pocos principios (defender cerrados, atacar abiertos, comunicación, salida segura), enseñado con juegos reducidos y con el diseño de la tarea más que con charlas. No hay evidencia que demuestre que un sistema o una forma de presionar sea mejor, así que el sistema debe adaptarse a tus jugadores y no al revés.",
  ev:["Los juegos reducidos son una herramienta eficaz para mejorar el rendimiento de jóvenes; una revisión de 45 estudios lo concluye, aunque casi todos son transversales, por lo que no prueban causa [73]. Hay trabajo reciente que combina principios tácticos con juegos reducidos para mejorar la toma de decisiones, pero solo vi su título [72].","No encontré estudios que prueben un modelo de juego en 13-14 años. Lo más cercano son estudios de U8 a U13; en ellos, los equipos de más edad aplican con más regularidad los principios de amplitud y concentración [73].","El formato de 11 contra 11 se considera demasiado grande hasta U13 según varios autores, y pasar de 9 contra 9 a 11 contra 11 en U13 cambia los patrones de juego [74]. U.S. Soccer recomienda juegos reducidos hasta 9 contra 9 en U13-14, lo cual es guía de federación, no investigación [75].","Presión: la métrica PPDA mide intensidad de presión, no goles. En la Eurocopa 2020, solo 42 de 406 recuperaciones altas acabaron en tiro (cerca del 10%) y cinco en gol [76]; es un análisis de una empresa de datos, no un estudio revisado.","Córners: en el Mundial 2018 se marcó un 3,7% de los córners (22 de 600); la marca zonal concedió más (6,0%) que la mixta (3,7%) [77]. En la Premier League no hubo relación significativa entre el sistema de marca y los intentos recibidos [78]. FIFA, en el Mundial de Clubes 2025, tampoco concluye que un sistema sea mejor [79].","Salida desde atrás: lo que hay son guías de práctica, no estudios. La FA y FIFA la plantean como preparación para el fútbol de élite [80][81]; las guías para jóvenes avisan de que un mal pase del portero o un mal control se convierte en ocasión rival, y recomiendan abrir a los defensas, tener siempre una opción libre y evitar pases laterales por el centro.","Enfoque por restricciones: cambiar el espacio, el número de jugadores o las reglas de la tarea para que aparezca la conducta deseada. Es una propuesta teórica distinta de la enseñanza de juegos para la comprensión [82]; casi todos sus estudios son de educación física, no de fútbol."],
  lim:["Ninguna fuente prueba un modelo de juego, un sistema ni un tipo de presión a los 13-14 años.","Los datos de presión, córners y salida desde atrás son de fútbol adulto o de élite; se trasladan por analogía.","Los estudios de córners son pequeños, de un torneo y miden resultados distintos.","Las fuentes 72, 73, 75 y 80 a 82 las leí solo en resumen o por terceros; de la 72 solo el título.","El modelo que propongo es criterio mío a partir de tus observaciones del 22/10 y de la hoja de ruta, no un modelo validado."],
  rec:[["1. Pocos principios","Un modelo de juego de cuatro o cinco frases, que los jugadores puedan repetir: defender cerrados, atacar abiertos, hablar, tras el error presionar, salir con una opción libre."],["2. Enseñar con juegos reducidos","Usa 4 contra 4 hasta 8 contra 8 con reglas que fuercen el principio (por ejemplo, gol solo tras tres pases, o doble valor al gol tras robo). Menos charla, más diseño de la tarea."],["3. Sistema acorde a la plantilla","Mantén el que ya conocen (4-1-4-1 o 4-2-3-1) hasta que el equipo se estabilice, y cambia solo con motivo: es una decisión que debe tomarse con datos de la app."],["4. Presión por zonas","Pide una presión corta y ordenada tras pérdida (cinco segundos) antes que una presión alta constante; la evidencia no demuestra que presionar alto genere más goles."],["5. Salida desde atrás con red","Practica la salida con portero, defensas abiertos y un pivote; regla simple: si no hay pase limpio, balón largo o fuera. En partido, juzga según el rival."],["6. Balón parado con roles","Define quién marca a quién y quién queda en los palos, y entrena el córner un rato cada semana. No hay sistema mejor: importan los roles individuales."],["7. Registro táctico","Apunta tras cada partido tres cosas: qué principios se vieron, qué no y por qué. La pestaña Partido y Sesiones sirven para eso."],["8. Formato","Si el club decide, plantea partidos de 9 contra 9 en algún entreno para trabajar principios con más contactos de balón."]],
  pro:["Cada semana: un principio principal y uno secundario.","Cada partido: tres observaciones tácticas anotadas.","Cada mes: ¿el modelo sigue sirviendo a estos jugadores?","Cada trimestre: decidir si cambiar sistema con datos, no por intuición."],
  ind:["Todos los jugadores saben repetir los principios del modelo.","Se ve el principio de la semana en el partido.","Menos goles recibidos tras pérdida.","Más pases hacia delante tras la salida del portero."]},
 {t:"Tema 8 · Análisis y datos",
  con:"Para tu equipo recomiendo medir proceso y no solo resultado: pocos datos fáciles de anotar en directo (minutos, tiros, pérdidas tras las que encajáis, balones parados), mirados en tendencias de varios partidos y no en uno solo, con un clima centrado en el aprendizaje. Con 16 equipos y 0 puntos, cada partido pesa mucho en el ánimo; los datos sirven para ver si el equipo mejora aunque el marcador no lo diga todavía. No hay estudios que demuestren que el análisis con vídeo mejore el aprendizaje a esta edad.",
  ev:["En 22 sesiones de feedback con vídeo de entrenadores juveniles de élite, lo más frecuente fue que hablara el entrenador, seguido del silencio y la participación del jugador [83]. Este estudio describe al entrenador, no mide si los jugadores aprenden más. Un estudio de 2011 sobre cómo entregan el vídeo los entrenadores ingleses existe, pero solo vi la ficha [84].","En un estudio con jugadores muy talentosos en 3 contra 2, dejar que el jugador elija cuándo ver el vídeo lo hizo participar y hablar más, sin una mejora de rendimiento significativa según el entrenador [85]. En un piloto con 30 jugadores de 12 a 15 años, el vídeo en el móvil se asoció a mejor pase, pero con un solo grupo y sin control [86].","Los goles esperados (xG) en un solo partido varían mucho por azar [87][88]. La regla práctica es mirar tendencias de 10 a 15 partidos, pero es una regla de analistas, no un umbral estadístico validado.","El clima de maestría (se premia el esfuerzo y la mejora) se asocia a más permanencia, y el de rendimiento (importa ganar y destacar) a más abandono [90]. En un estudio con entrenadores formados, abandonó el 11% frente al 26% del otro grupo, sin que lo explicara el récord de victorias [89]; son resultados de un solo grupo de investigación y de una temporada de baloncesto.","Jugadores y entrenadores perciben distinto el clima: los jugadores lo sienten más orientado al rendimiento de lo que el entrenador cree [91]. Por eso conviene preguntar a los jugadores, no suponer.","Minutos de juego: lo que hay son políticas de clubes y federaciones. La guía de Cornwall pide igualdad en sub-11 y, de sub-12 a sub-16, igualdad medida a lo largo de la temporada [92]. No encontré un estudio riguroso que relacione minutos iguales con permanencia."],
  lim:["No hay estudios controlados que muestren que el análisis con vídeo o notacional mejore el aprendizaje en juveniles.","Los números de xG y de presión vienen de fútbol adulto y de análisis de empresas de datos; con las pocas muestras de un equipo juvenil no se pueden usar como verdad.","Los datos de abandono son de un grupo de investigación y de una temporada.","Las fuentes 84, 88 y 89 las vi solo como ficha o por terceros; todas las demás en resumen.","Los indicadores que propongo son criterio mío; hay que ver cuáles se pueden anotar de verdad en directo."],
  rec:[["1. Pocos datos","Anota cinco cosas por partido: minutos por jugador, tiros a favor y en contra, goles encajados tras pérdida, balones parados a favor y en contra, y una observación táctica. La pestaña Partido ya recoge los minutos."],["2. Tendencias, no partidos","Mira cada cuatro partidos, nunca un partido suelto, y sin sacar conclusiones de goles individuales. La regla de 10 a 15 partidos es orientativa."],["3. Proceso como meta","Define metas de proceso para cada partido (ejemplo: 'hablar más', 'atacar abiertos') y dilo en la charla; que el resultado sea consecuencia."],["4. Preguntar a los jugadores","Una vez al mes, tres preguntas anónimas: ¿te sientes valorado?, ¿entiendes lo que se pide?, ¿te diviertes? Compara con lo que tú creías."],["5. Vídeo corto y elegido","Si grabas, usa clips de menos de un minuto y deja que el jugador elija qué ver. Necesita permiso de las familias y custodia segura de las imágenes de menores."],["6. Minutos por temporada","Mide la igualdad de minutos a lo largo de la temporada, no por partido, y mira si los que menos juegan son los más pequeños o los nacidos más tarde."],["7. Resultado sin dramatismo","Con 0 puntos, evita el relato de 'salvar la categoría' hacia los jugadores; el objetivo común es mejorar y competir cada semana."],["8. Informe mensual","Un resumen de una página con tendencias, y qué ajustar. La app no lo genera todavía; es una mejora pendiente."]],
  pro:["Cada partido: cinco datos anotados y una observación táctica.","Cada cuatro partidos: revisar tendencias.","Cada mes: tres preguntas a los jugadores y revisión de minutos.","Cada trimestre: revisar qué indicadores sirven."],
  ind:["Minutos repartidos con equilibrio a lo largo de la temporada.","Metas de proceso cumplidas, aunque no se gane.","Mejora de tiros y de goles encajados tras pérdida.","Jugadores que dicen que se divierten y se sienten valorados."]},
 {t:"Tema 9 · Formación del entrenador",
  con:"Para ti recomiendo dos vías a la vez: la formal, preguntando a la FCF y al club por el curso que corresponda y su calendario, y la informal, con tu ayudante y otros entrenadores como mentores y con revisión periódica de tu propio trabajo. Las fechas, precios y requisitos que vi son de fuentes antiguas o de otra federación, así que hay que confirmarlos con la FCF antes de decidir nada.",
  ev:["Según una noticia del FC Barcelona, la FCF ofrece el Curso Básico de Entrenador, equivalente a UEFA B, con 205 horas (125 de teoría y 80 de práctica); habilita para entrenar equipos de Tercera Catalana y de todo el fútbol base [93]. Es una noticia de club y puede estar desactualizada.","Un anuncio de 2017 describe el curso de Monitor de Fútbol Base como una formación de 60 horas, con 16 años cumplidos, reconocimiento médico y ESO, a 210 euros [94]. No confirma que lo organice la FCF ni que siga vigente.","Las bases del curso UEFA C de la federación valenciana piden 16 años, ESO o superior, y un período de prácticas (ABR) de seis meses en un máximo de dos clubes, con tutor de nivel 1 como mínimo [95]. Son de otra federación; las de Cataluña pueden variar.","Estructura general: nivel 1 equivale a UEFA B, nivel 2 a UEFA A y nivel 3 a UEFA Pro [95]. Las licencias UEFA las emite cada federación y tienen una vigencia de tres años [98].","Cómo aprenden los entrenadores: se defiende que el aprendizaje de los entrenadores juveniles no debe depender solo de cursos formales, y que el aprendizaje informal (hablar con otros entrenadores, aprender haciendo) se valora más por su contexto y utilidad [96]. Un estudio de seis entrenadores indica que la mentoría y las comunidades de aprendizaje ayudaron a resolver problemas, pero es pequeño [97].","Los programas de formación de entrenadores en apoyo a la autonomía cambian la conducta del entrenador, aunque falta ver el efecto en los niños [60]."],
  lim:["No encontré el calendario ni el precio actuales de la FCF; los datos son antiguos, de otra federación o de divulgación.","La mayoría de lo que sé sobre el ABR viene de la federación valenciana, no de la catalana.","El efecto de la mentoría y de las comunidades de aprendizaje se apoya en estudios muy pequeños.","No encontré evidencia de que un título concreto haga mejor entrenador; los cursos acreditan competencia y habilitan para entrenar.","Cualquier fecha, precio o requisito debe confirmarlo la FCF o la secretaría del club."],
  rec:[["1. Pregunta oficial","Pide al club y a la FCF por escrito: qué curso corresponde, cuándo es la próxima convocatoria, el precio y los requisitos de prácticas. Es un trámite que decide el club con la federación."],["2. Mentor cercano","Elige a una persona del cuerpo técnico con quien hablar cada semana de lo que sale bien y mal. tu ayudante puede ser una opción si su papel encaja."],["3. Observar a otros","Mira dos o tres entrenos de otros entrenadores del club y apunta una idea de cada uno."],["4. Que te observen","Pide a una persona de confianza que te mire un entreno al mes y te diga una cosa a mantener y otra a mejorar."],["5. Diario de entrenador","Tras cada sesión, tres líneas: qué ha salido, qué no, qué cambio. La pestaña Sesiones tiene observaciones."],["6. Formación continua","Lee una fuente de la Biblioteca al mes; empieza por los temas 1 y 2, que son los de mayor impacto ahora."],["7. Documentación en regla","Guarda tu titulación y tu licencia al día y consérvalas junto a los acuerdos por escrito con el club."],["8. Comunidad","Busca encuentros con otros entrenadores de la zona para compartir ejercicios y problemas."]],
  pro:["Cada semana: hablar con el mentor.","Cada mes: una observación externa y una fuente leída.","Cada trimestre: revisar con el club el plan de titulación.","Cada temporada: valorar qué has aprendido y qué toca."],
  ind:["Fecha y plan de titulación acordados por escrito con el club.","Una conversación semanal con un mentor.","Diario de sesiones al día.","Una idea nueva aplicada cada mes."]},
 {t:"Tema 10 · Organización del club y familias",
  con:"Para tu equipo recomiendo hablar pronto y por escrito con las familias (filosofía, minutos, conducta en la banda y canales de contacto), y confirmar con el coordinador lo que depende del club: protección del menor, seguro y mutua, botiquín y duchas. La protección del menor es una obligación del club y no un extra; la información sobre seguros y certificados que encontré es antigua o no es de fútbol, así que hay que pedirla al club.",
  ev:["El Protocol marc de la Generalitat (GOV/252/2023, DOGC de diciembre de 2023) incluye la figura del delegado o delegada de protección y apartados para federaciones y clubes [100]. La FCF dispone de un protocolo propio en el que insiste en identificar al delegado en cada club [101].","La LOPIVI (art. 48) obliga a las entidades que hacen actividades deportivas con menores de forma habitual a aplicar los protocolos, implantar un sistema de monitorización y designar un delegado de protección [102].","La conducta de los padres en la banda se asoció con la de sus hijos: padres que animan, hijos con más conducta positiva; padres críticos o que increpan al árbitro, más conducta antisocial. El 69% de 67 jóvenes de 12 a 17 años reportó alguna conducta negativa de sus padres [99]. Es un estudio pequeño, basado en percepciones y correlacional.","No encontré evaluaciones de si un código de conducta para familias cambia el comportamiento ni de si una reunión de pretemporada reduce conflictos. Las guías de práctica recomiendan explicar la filosofía y el criterio de minutos, que las decisiones de juego son del cuerpo técnico, y acordar canales y plazos de respuesta [103][104].","Seguros: el documento que encontré es de otro deporte y de 2010: el seguro federativo cubría accidentes en partidos, calentamiento y entrenos de club, y los partes los firmaba el club [105]. No encontré el procedimiento actual de la FCF.","El protocolo de vestuarios y presencia de adultos que verifiqué en una sesión anterior en el texto oficial está recogido en la pestaña Reglas [100]."],
  lim:["No hay evidencia controlada de que los códigos de conducta o las reuniones de familias mejoren el clima; son prácticas recomendadas.","El estudio de conducta de padres es de Australia y con 67 jóvenes.","No pude confirmar si hace falta certificado de delitos sexuales para el delegado ni para el cuerpo técnico en Cataluña; lo debe aclarar el club o la FCF.","Las fuentes 101, 102, 105 y las guías de familias las leí en resumen o por terceros.","Nada de esto es asesoramiento jurídico."],
  rec:[["1. Reunión de familias","Una reunión corta al empezar y un mensaje por escrito: filosofía del equipo, cómo se reparten los minutos, qué se espera de la grada, cómo contactarte. El texto debe pasar antes por el club."],["2. Canal único","Un solo grupo o canal para avisos y un plazo de respuesta que cumplas. Los mensajes a través de los jugadores se pierden."],["3. Banda sin presión","Pide a las familias animar a todos, sin dar instrucciones desde la banda y sin dirigirse al árbitro. Si hace falta, que lo apoye el club."],["4. Minutos explicados","Explica en la reunión que las decisiones de juego son del cuerpo técnico, el criterio general y que mides los minutos por temporada."],["5. Protección del menor","Pregunta al coordinador quién es el delegado de protección del club, si el cuerpo técnico firmó el protocolo y qué se hace en duchas y vestuarios. Es una obligación del club."],["6. Seguro y lesiones","Confirma con el club cómo se tramita una lesión, quién firma el parte y cuál es la mutua."],["7. Botiquín y emergencias","Revisa el botiquín, sabe dónde está el centro sanitario cercano y ten un teléfono de cada familia y un autorizado para recoger."],["8. Imágenes y datos","No publiques fotos o datos de los jugadores sin permiso de las familias, y no los subas a la nube; la app se queda en local."]],
  pro:["Cada temporada: reunión de familias y mensaje escrito.","Cada mes: revisar quejas o dudas de familias y responderlas en el plazo.","Cada partido: botiquín, teléfonos y plan de emergencia.","Cada trimestre: confirmar con el club protocolo, seguro y mutua."],
  ind:["Delegado de protección identificado y protocolo firmado.","Todas las familias con un canal y un plazo claros.","Sin incidentes de grada sin gestionar.","Procedimiento de lesiones conocido por todo el cuerpo técnico."]}];

     '<h3>Qué dicen las fuentes</h3><ul>'+x.ev.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>'+
     (x.tab?'<h3>Comparativa de modelos</h3><div class="sc"><table><tr><th>Modelo</th><th>Qué hace</th><th>Qué puedes trasladar</th><th>Fiabilidad</th></tr>'+x.tab.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';}).join('')+'</table></div>':'')+
     '<h3>Límites y lo no verificado</h3><ul>'+x.lim.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>'+
     '<h3>Rutina</h3><ul>'+x.pro.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul><h3>Indicadores</h3><ul>'+x.ind.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>';
  });
  h+='<div class="card"><h2>Fuentes</h2><ol style="padding-left:20px">'+BIB_SRC.map(function(s){return '<li value="'+s[0]+'"><a class="lk" target="_blank" rel="noopener noreferrer" href="'+esc(s[2])+'">'+esc(s[1])+'</a><br><span class="note">'+esc(s[3])+' · fiabilidad: '+esc(s[4])+'</span></li>';}).join('')+'</ol></div>';

  if(t.hasAttribute('data-pri')){PI(S.pid).pri[parseInt(t.getAttribute('data-pri'),10)]=t.value;save();render();return;}
  if(t.hasAttribute('data-pig')){PI(S.pid).obj=t.value;save();return;}
  if(t.hasAttribute('data-ae')){S.ae[t.getAttribute('data-ae')]=t.value;save();return;}
  if(t.hasAttribute('data-fa')){S.fa[t.getAttribute('data-fa')]=t.value;save();return;}
  if(t.hasAttribute('data-fic')){ensureF(S.fid)[t.getAttribute('data-fic')]=t.value;save();return;}
  if(t.hasAttribute('data-oest')){ensureF(S.fid).obj[parseInt(t.getAttribute('data-oest'),10)].est=t.value;save();render();return;}
  if(t.hasAttribute('data-msg')){S.msg[t.getAttribute('data-msg')]=t.value;save();render();return;}
  if(t.hasAttribute('data-cq')){
    var ci=t.getAttribute('data-ci');S.cap.auto[ci]=S.cap.auto[ci]||{};S.cap.auto[ci][t.getAttribute('data-cq')]=t.value;save();if(t.getAttribute('data-cq')!=='nt')render();return;
  }
  if(t.hasAttribute('data-todo')){S.todo[t.getAttribute('data-todo')]=t.checked;save();render();return;}
});
document.addEventListener('pointerdown',dragStart);
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);
window.addEventListener('resize',function(){if(S.tab==='pizarra')drawBoard();});
(function(){var n=P(6);if(!S.m1){if(n&&n.foot==='?'){n.foot='Z';n.note='Zurdo confirmado: opción de central o lateral izquierdo';}S.m1=1;save();}})();
render();
})();
